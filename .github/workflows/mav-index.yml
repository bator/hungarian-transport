name: MÁV index

# The release's MÁV pipeline end to end, without publishing anything: MÁV's
# GTFS with the repository's credentials, the Hungary OSM extract, pfaedle,
# then build_mav_index.py and its audit. The index and its statistics are
# kept as a short-lived artifact. A pull request from a fork gets no secrets:
# the check then says so and passes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mav-index.yml
      - scripts/release_mav_index.sh
      - scripts/build_mav_index.py
      - scripts/index_digest.py
      - custom_components/hungarian_transport/mav_index.py

permissions:
  contents: read

concurrency:
  group: mav-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mav:
    name: Build the MÁV index with pfaedle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Only whether both are set; the values stay in the step that uses them.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
    steps:
      - name: No MÁV credentials
        if: env.MAV_SECRETS != 'true'
        run: echo "::notice title=MÁV index not built::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets here (a fork's pull request gets none); nothing to check."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.MAV_SECRETS == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.MAV_SECRETS == 'true'
        with:
          python-version: "3.12"

      # Geofabrik refreshes the extract daily; a week-old one matches the rails
      # as well and saves 300 MB per run.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      - name: MÁV GTFS, pfaedle, build and audit
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav"

      # The weekly release publishes only when the index changed. Built again
      # from a second pfaedle run under another hash seed, it must give the
      # same content digest, or every week would count as a change.
      - name: Same feed, same index
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
          MAV_INDEX_OUT: mav-index.again.json.gz
          PYTHONHASHSEED: "4242"
        run: |
          set -euo pipefail
          cp mav-build.json mav-build.first.json
          GITHUB_STEP_SUMMARY=/dev/null bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav-again" > /dev/null
          mv mav-build.first.json mav-build.json
          first=$(python3 scripts/index_digest.py mav-index.json.gz | cut -d' ' -f1)
          again=$(python3 scripts/index_digest.py mav-index.again.json.gz | cut -d' ' -f1)
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import gzip, json
          a = json.loads(gzip.decompress(open("mav-index.json.gz", "rb").read()))
          b = json.loads(gzip.decompress(open("mav-index.again.json.gz", "rb").read()))
          print()
          print(f"Second build: feed `{b.get('feed')}`, {len(b['n'])} trains, {len(b['l'])} lines, "
                f"same decompressed JSON: {a == b}")
          PY
          echo "content digest: ${first} / ${again}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$first" ] || [ "$first" != "$again" ]; then
            echo "::error title=MÁV index not reproducible::Two builds of the same feed differ (${first} vs ${again}); the weekly release would publish every week."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.MAV_SECRETS == 'true'
        with:
          name: mav-index
          path: |
            mav-index.json.gz
            mav-build.json
          if-no-files-found: error
          retention-days: 3
