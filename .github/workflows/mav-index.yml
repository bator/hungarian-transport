name: MÁV index

# The release's MÁV pipeline end to end, without publishing anything: MÁV's
# GTFS with the repository's credentials, the Hungary OSM extract, pfaedle,
# then build_mav_index.py and its audit. The index and its statistics are
# kept as a short-lived artifact. A pull request from a fork gets no secrets:
# the check then says so and passes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mav-index.yml
      - scripts/release_mav_index.sh
      - scripts/build_mav_index.py
      # build_mav_index.py imports these (scripts/test_workflows.py checks).
      - scripts/gtfs_compact.py
      - scripts/index_digest.py
      - custom_components/hungarian_transport/mav_index.py
      - custom_components/hungarian_transport/gtfs_feed.py
      # The daily workflow's Pages site from the same build (not published).
      - scripts/mav_pages_site.py
      - scripts/mav_shrink_guard.py
      - scripts/pages_timetables.py

permissions:
  contents: read

concurrency:
  group: mav-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mav:
    name: Build the MÁV index with pfaedle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Only whether both are set; the values stay in the step that uses them.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
    steps:
      - name: No MÁV credentials
        if: env.MAV_SECRETS != 'true'
        run: echo "::notice title=MÁV index not built::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets here (a fork's pull request gets none); nothing to check."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.MAV_SECRETS == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.MAV_SECRETS == 'true'
        with:
          python-version: "3.12"

      # Geofabrik refreshes the extract daily; a week-old one matches the rails
      # as well and saves 300 MB per run. Saved only after a build that went
      # through: an extract that broke off is never kept for the week.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm-cache
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      - name: MÁV GTFS, pfaedle, build and audit
        id: mav
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.MAV_SECRETS == 'true' && steps.mav.outcome == 'success' && steps.osm-cache.outputs.cache-hit != 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # The daily Pages workflow deploys the MÁV index only when its content
      # digest changed (or the published one is 12 hours old). Built again
      # from a second pfaedle run under another hash seed, it must give the
      # same content digest, or every run would count as a change. The same
      # zip as the first build: no second login, and a feed MÁV replaced in
      # between cannot pass for a build that is not reproducible.
      - name: Same feed, same index
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_ZIP: ${{ runner.temp }}/mav/gtfs/mav-gtfs.zip
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
          MAV_INDEX_OUT: mav-index.again.json.gz
          PYTHONHASHSEED: "4242"
        run: |
          set -euo pipefail
          cp mav-build.json mav-build.first.json
          GITHUB_STEP_SUMMARY=/dev/null bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav-again" > /dev/null
          mv mav-build.first.json mav-build.json
          first=$(python3 scripts/index_digest.py mav-index.json.gz | cut -d' ' -f1)
          again=$(python3 scripts/index_digest.py mav-index.again.json.gz | cut -d' ' -f1)
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import gzip, json
          a = json.loads(gzip.decompress(open("mav-index.json.gz", "rb").read()))
          b = json.loads(gzip.decompress(open("mav-index.again.json.gz", "rb").read()))
          print()
          print(f"Second build: feed `{b.get('feed')}`, {len(b['n'])} trains, {len(b['l'])} lines, "
                f"same decompressed JSON: {a == b}")
          PY
          echo "content digest: ${first} / ${again}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$first" ] || [ "$first" != "$again" ]; then
            echo "::error title=MÁV index not reproducible::Two builds of the same feed differ (${first} vs ${again}); the daily Pages workflow would deploy on every run."
            exit 1
          fi

      # What mav-index-daily.yml would publish on GitHub Pages from this build
      # (scripts/mav_pages_site.py, then the site job's
      # scripts/pages_timetables.py assemble against an empty stand-in for
      # the live site: no Volán or city index to carry), written to the
      # runner only: the files and their sizes in the summary, and whether
      # the second pfaedle run gave the same overlay bytes (if not, the
      # daily site deploys every day).
      - name: Pages site (not published)
        if: ${{ !cancelled() && steps.mav.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/mav_pages_site.py --index mav-index.json.gz --stats mav-build.json \
            --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/mav-part" \
            --gtfs-zip "$RUNNER_TEMP/mav/gtfs/mav-gtfs.zip" --pfaedle-dir "$RUNNER_TEMP/mav/gtfs-out"
          mkdir -p "$RUNNER_TEMP/no-live"
          python3 scripts/pages_timetables.py assemble --out "$RUNNER_TEMP/site" --commit "$GITHUB_SHA" \
            --live-dir "$RUNNER_TEMP/no-live" --mav-part "$RUNNER_TEMP/mav-part"
          {
            echo
            echo "### Pages site (not published)"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            for f in "$RUNNER_TEMP"/site/*; do
              echo "| $(basename "$f") | $(stat -c %s "$f") |"
            done
            echo "| total | $(du -cb "$RUNNER_TEMP"/site/* | tail -n 1 | cut -f1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -d "$RUNNER_TEMP/mav-again/gtfs-out" ]; then
            python3 - "$RUNNER_TEMP/mav-again/gtfs-out" "$RUNNER_TEMP/site/mav-pfaedle-overlay.zip" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import mav_pages_site as site
          with tempfile.TemporaryDirectory() as tmp:
              again = Path(tmp) / site.OVERLAY_NAME
              site.write_overlay(Path(sys.argv[1]), again)
              same = again.read_bytes() == Path(sys.argv[2]).read_bytes()
          print()
          print(f"Overlay of the second pfaedle run: same bytes: {same}")
          PY
          fi

      # Also when a step failed: a build that is not reproducible is exactly
      # when both indexes are worth a look. A build that failed earlier
      # leaves fewer files, and that is no error of its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.MAV_SECRETS == 'true' }}
        with:
          name: mav-index
          path: |
            mav-index.json.gz
            mav-index.again.json.gz
            mav-build.json
          if-no-files-found: warn
          retention-days: 3
