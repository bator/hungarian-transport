name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "rev = 1.4.7-rev.N prerelease (default, next patch after HACS stable 1.4.6). Do not pick patch/minor/major unless asked."
        type: choice
        options:
          - rev
          - patch
          - minor
          - major
        default: rev

permissions:
  contents: write

jobs:
  release:
    name: Build indexes and publish integration zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.bump || '' }}
        run: |
          set -euo pipefail

          latest_stable() {
            gh release list --limit 50 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease==false) | .tagName | select(test("-rev\\.")|not)][0] // empty'
          }

          latest_rev_n() {
            local base="$1"
            local n=0 t r
            while IFS= read -r t; do
              r="${t#v${base}-rev.}"
              if [[ "$r" =~ ^[0-9]+$ ]] && [ "$r" -gt "$n" ]; then n=$r; fi
            done < <(gh release list --limit 50 --json tagName --jq '.[].tagName' || true)
            echo "$n"
          }

          parse_semver() {
            local ver="${1#v}"
            ver="${ver%%-*}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            patch="${patch%%.*}"
            echo "${major:-0} ${minor:-0} ${patch:-0}"
          }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            tag=$(latest_stable)
            if [ -z "$tag" ]; then
              echo "No stable release to refresh; skip."
              echo "create=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Refreshing GTFS zip on ${tag} (no version bump)"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable=$(latest_stable)
          if [ -z "$stable" ]; then
            echo "No previous stable release; skip."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r major minor patch <<< "$(parse_semver "$stable")"
          bump="${BUMP:-rev}"
          if [ "$bump" = "major" ]; then
            tag="v$((major + 1)).0.0"
          elif [ "$bump" = "minor" ]; then
            tag="v${major}.$((minor + 1)).0"
          elif [ "$bump" = "patch" ]; then
            tag="v${major}.${minor}.$((patch + 1))"
          else
            # Live Lovelace is the next patch, published only as a prerelease,
            # so HACS stable stays on the last real release.
            base="${major}.${minor}.$((patch + 1))"
            n=$(latest_rev_n "$base")
            tag="v${base}-rev.$((n + 1))"
          fi
          echo "Manual ${bump} from ${stable} -> ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      # The weekly refresh re-packs an existing stable release. Build it from
      # that tag, not from main, so the zip never ships unreleased card code
      # (or an index schema the released card cannot read) under an old version.
      - name: Check out released code for refresh
        if: steps.ver.outputs.create == 'true' && github.event_name == 'schedule'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/${TAG}"
          git log --oneline -1

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.create == 'true'
        with:
          python-version: "3.12"

      - name: Build GTFS indexes
        if: steps.ver.outputs.create == 'true'
        env:
          BAHART_GTFS_URL: ${{ secrets.BAHART_GTFS_URL }}
          MOBILITY_DATABASE_REFRESH_TOKEN: ${{ secrets.MOBILITY_DATABASE_REFRESH_TOKEN }}
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
        run: |
          python3 scripts/build_volan_index.py
          python3 scripts/build_city_index.py
          if [ -d pfaedle-out ] || [ -d /opt/pfaedle-trial/out ]; then
            python3 scripts/build_mav_index.py
          else
            echo "skip mav index (no pfaedle on runner; do not ship an official-zip chord)"
          fi
          mkdir -p dist
          cp -f volan-index.json.gz city-index.json.gz dist/
          if [ -f mav-index.json.gz ]; then cp -f mav-index.json.gz dist/; fi
          ls -lh dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz dist/mav-index.json.gz 2>/dev/null || true

      - name: Stamp release and pack assets
        if: steps.ver.outputs.create == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          ver="${tag#v}"
          export VER="$ver"
          python3 <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?", ver):
              raise SystemExit("bad ver")
          path = pathlib.Path("dist/hungarian-transport.js")
          text = path.read_text(encoding="utf-8")
          # Hand-written bundles used `const ... = '...'`; esbuild emits
          # `var ... = "..."`. Accept both so tag refreshes of old releases work.
          text, n = re.subn(
              r"""^(const|var|let) CARD_VERSION = (['"]).*\2;""",
              lambda m: '%s CARD_VERSION = %s%s%s;' % (m.group(1), m.group(2), ver, m.group(2)),
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("CARD_VERSION stamp failed")
          path.write_text(text, encoding="utf-8")
          PY
          mkdir -p custom_components/hungarian_transport/www
          cp dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz custom_components/hungarian_transport/www/
          if [ -f dist/mav-index.json.gz ]; then cp dist/mav-index.json.gz custom_components/hungarian_transport/www/; fi
          cp -r dist/leaflet custom_components/hungarian_transport/www/
          python3 <<'PY'
          import json, os, pathlib
          path = pathlib.Path("custom_components/hungarian_transport/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VER"]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd custom_components/hungarian_transport && zip -qr9 ../../hungarian-transport.zip .)
          (cd dist && zip -9r ../hungarian-transport-frontend.zip hungarian-transport.js leaflet volan-index.json.gz city-index.json.gz $( [ -f mav-index.json.gz ] && echo mav-index.json.gz ))
          ls -lh hungarian-transport.zip hungarian-transport-frontend.zip

      - name: Publish GitHub release
        if: steps.ver.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          ver="${tag#v}"
          notes="Hungarian transport ${ver}."
          extra=()
          if [[ "$tag" == *-rev.* ]]; then
            extra+=(--prerelease)
            notes="${notes} Live Lovelace revision between HACS releases."
          else
            notes="${notes} Includes fresh Volán and city GTFS indexes."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" hungarian-transport.zip hungarian-transport-frontend.zip --clobber
          else
            # Tag the commit that was built, not whatever the default branch is now.
            gh release create "$tag" hungarian-transport.zip hungarian-transport-frontend.zip --target "$GITHUB_SHA" --title "$tag" --notes "$notes" "${extra[@]}"
          fi
