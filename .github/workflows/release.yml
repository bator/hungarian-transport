name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "rev = 1.4.0-rev.N prerelease on current stable; minor = 1.5.0 HACS release; major = 2.0.0"
        type: choice
        options:
          - rev
          - minor
          - major
        default: rev

permissions:
  contents: write

jobs:
  release:
    name: Build indexes and publish zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.bump || '' }}
        run: |
          set -euo pipefail

          latest_stable() {
            gh release list --limit 50 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease==false) | .tagName | select(test("-rev\\.")|not)][0] // empty'
          }

          latest_rev_n() {
            local base="$1"
            local n=0 t r
            while IFS= read -r t; do
              r="${t#v${base}-rev.}"
              if [[ "$r" =~ ^[0-9]+$ ]] && [ "$r" -gt "$n" ]; then n=$r; fi
            done < <(gh release list --limit 50 --json tagName --jq '.[].tagName' || true)
            echo "$n"
          }

          parse_semver() {
            local ver="${1#v}"
            ver="${ver%%-*}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            patch="${patch%%.*}"
            echo "${major:-0} ${minor:-0} ${patch:-0}"
          }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            tag=$(latest_stable)
            if [ -z "$tag" ]; then
              echo "No stable release to refresh; skip."
              echo "create=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Refreshing GTFS zip on ${tag} (no version bump)"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable=$(latest_stable)
          if [ -z "$stable" ]; then
            echo "No previous stable release; skip."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r major minor patch <<< "$(parse_semver "$stable")"
          bump="${BUMP:-rev}"
          if [ "$bump" = "major" ]; then
            tag="v$((major + 1)).0.0"
          elif [ "$bump" = "minor" ]; then
            tag="v${major}.$((minor + 1)).0"
          else
            base="${major}.${minor}.${patch}"
            n=$(latest_rev_n "$base")
            tag="v${base}-rev.$((n + 1))"
          fi
          echo "Manual ${bump} from ${stable} -> ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.create == 'true'
        with:
          python-version: "3.12"

      - name: Build GTFS indexes
        if: steps.ver.outputs.create == 'true'
        run: |
          python3 scripts/build_volan_index.py
          python3 scripts/build_city_index.py
          ls -lh volan-index.json.gz city-index.json.gz hungarian-transport.js

      - name: Stamp card version and pack zip
        if: steps.ver.outputs.create == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          ver="${tag#v}"
          sed -i "s/^const CARD_VERSION = '.*';/const CARD_VERSION = '${ver}';/" hungarian-transport.js
          zip -9 hungarian-transport.zip hungarian-transport.js volan-index.json.gz city-index.json.gz
          ls -lh hungarian-transport.zip

      - name: Publish GitHub release
        if: steps.ver.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          ver="${tag#v}"
          notes="Hungarian transport ${ver}."
          extra=()
          if [[ "$tag" == *-rev.* ]]; then
            extra+=(--prerelease)
            notes="${notes} Live Lovelace revision between HACS releases."
          else
            notes="${notes} Includes fresh Volán and city GTFS indexes."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" hungarian-transport.zip --clobber
          else
            gh release create "$tag" hungarian-transport.zip --title "$tag" --notes "$notes" "${extra[@]}"
          fi
