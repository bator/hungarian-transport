name: Release

on:
  push:
    tags:
      - "v*"
  # Weekly: rebuild the GTFS indexes on the latest stable tag's code and,
  # when a feed changed, publish them as the next patch release, tagged on
  # that same commit (no unreleased code). A published release is never
  # changed afterwards: what HACS installs as a version stays that version.
  # Each release carries SHA256SUMS, a build provenance attestation and
  # hungarian-transport-build.json (the tag, and the commit it was built from).
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "rev = a -rev.N prerelease two patches up (1.9.2-rev.1 after stable 1.9.0; the weekly timetable release takes 1.9.1 and stays below it, then starts a rev run itself while a series is open; HACS stable stays). patch = stable release of main, numbered as the open -rev series (else next patch). patch/minor/major: only when asked."
        type: choice
        options:
          - rev
          - patch
          - minor
          - major
        default: rev
      allow_missing:
        description: "City feed ids (comma-separated, or all) the city index may lose against the previous release. Normally empty."
        type: string
        default: ""

# Only the publish job writes; the jobs that run npm, the builders and the
# downloaded GTFS feeds get a read-only token. Every action is pinned to a
# commit (the tag it was cut from in the comment), the publish job's
# download-artifact included; bump deliberately.
permissions:
  contents: read

# Two dispatch or weekly runs at once would race on the version number and
# on the release assets, so they queue in one group. GitHub keeps one running
# and one pending run per group and cancels the pending one when another
# arrives; a tag push waiting there would be dropped (a tag without a
# release). So each tag push has a group of its own and is never replaced.
# It may run next to a dispatch or weekly run: those never pick a version
# that is already a tag, and their publish refuses a tag that exists.
concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-tag-{0}', github.ref_name) || 'release' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      create: ${{ steps.ver.outputs.create }}
      ref: ${{ steps.ver.outputs.ref }}
      baseline: ${{ steps.ver.outputs.baseline }}
      target: ${{ steps.ver.outputs.target }}
      refresh: ${{ steps.ver.outputs.refresh }}
      beta: ${{ steps.ver.outputs.beta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing here pushes; gh gets its token from GH_TOKEN, not from .git/config.
          persist-credentials: false

      - name: Release from main only
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run the release from main, not ${GITHUB_REF}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main."
            exit 1
          fi

      - name: Resolve tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump || '' }}
        run: |
          set -euo pipefail

          # Every published release (tag, prerelease flag), last published
          # first, read once. gh lists by createdAt, which is the tagged
          # commit's date: a weekly timetable release tags the stable's own
          # commit, so the two tie. A GitHub API failure stops the run: an
          # empty list would mean "no -rev series" and "no such tag", and a
          # version picked on that could land above the beta channel or on a
          # tag that exists.
          if ! releases=$(gh release list --exclude-drafts --limit 1000 --json tagName,isPrerelease,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, (.isPrerelease | tostring)] | @tsv'); then
            echo "::error::Could not list the releases (GitHub API); no version is picked on a guess."
            exit 1
          fi

          # The highest stable version (vX.Y.Z, not a prerelease), however
          # many -rev.N came after it (24 after 1.4.2). By version, not by
          # date: createdAt ties a timetable release with its stable, and an
          # older version tagged or published later would win on any date.
          latest_stable() {
            awk -F'\t' '$2 == "false" && $1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 }' <<< "$releases" \
              | sort -V | tail -n 1
          }

          latest_rev_n() {
            local base="$1"
            local n=0 t r
            while IFS=$'\t' read -r t _; do
              r="${t#"v${base}-rev."}"
              if [[ "$r" =~ ^[0-9]+$ ]] && [ "$r" -gt "$n" ]; then n=$r; fi
            done <<< "$releases"
            echo "$n"
          }

          # Patch numbers of the -rev series of major.minor above patch
          # (vX.Y.P-rev.N with P > patch), one per line.
          open_revs() {
            local major="$1" minor="$2" patch="$3" t r
            while IFS=$'\t' read -r t _; do
              [[ "$t" == "v${major}.${minor}."*"-rev."* ]] || continue
              r="${t#"v${major}.${minor}."}"
              r="${r%%-rev.*}"
              if [[ "$r" =~ ^[0-9]+$ ]] && [ "$r" -gt "$patch" ]; then echo "$r"; fi
            done <<< "$releases"
          }

          # The highest of open_revs, 0 when there is none.
          newest_rev() {
            local r
            r=$(open_revs "$@" | sort -n | tail -n 1)
            echo "${r:-0}"
          }

          # A release or a bare tag (a tag push whose run has not published
          # yet). Only a 404 means free; any other API failure stops the run.
          tag_taken() {
            local out
            if cut -f1 <<< "$releases" | grep -qxF "$1"; then return 0; fi
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq .ref 2>&1); then return 0; fi
            if [[ "$out" == *"HTTP 404"* ]]; then return 1; fi
            echo "::error::Could not check whether tag $1 exists (GitHub API); stopping."
            exit 1
          }

          parse_semver() {
            local ver="${1#v}"
            ver="${ver%%-*}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            patch="${patch%%.*}"
            echo "${major:-0} ${minor:-0} ${patch:-0}"
          }

          # tag to publish, the code to build (ref), the release whose
          # indexes the new ones replace (baseline), the commit the new tag
          # points at (target) and whether this is a timetable-only release.
          emit() {
            {
              echo "tag=${1}"
              echo "create=${2}"
              echo "ref=${3:-$GITHUB_SHA}"
              echo "baseline=${4:-}"
              echo "target=${5:-$GITHUB_SHA}"
              echo "refresh=${6:-false}"
              echo "beta=${7:-false}"
            } >> "$GITHUB_OUTPUT"
          }

          latest=$(head -n 1 <<< "$releases" | cut -f1)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            emit "${GITHUB_REF_NAME}" true "" "$latest"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            stable=$(latest_stable)
            if [ -z "$stable" ]; then
              echo "No stable release to refresh; skip."
              emit "" false
              exit 0
            fi
            read -r major minor patch <<< "$(parse_semver "$stable")"
            # The next patch, which rev dispatches leave free (their series
            # starts two above the stable). It must stay below the newest
            # -rev series: semver ranks X.Y.P above X.Y.P-rev.N, and beta
            # users would be offered the old code of this refresh over the
            # prerelease. Only when that series sits on the next patch (no
            # rev dispatch since the last refresh) is there no room: the
            # refresh then goes above it and says so.
            rev=$(newest_rev "$major" "$minor" "$patch")
            next=$((patch + 1))
            # The beta job dispatches a rev run after every timetable release
            # while a -rev series is open, so that should not happen; when
            # that run failed, this is the fallback.
            if [ "$rev" -eq "$next" ]; then
              next=$((rev + 1))
              echo "::warning title=Timetable release above the beta::v${major}.${minor}.${rev}-rev.* is on the next patch, so this refresh is v${major}.${minor}.${next} and beta users are offered ${stable}'s code with it until the rev run after it is published."
            fi
            # Beta users run the open -rev series: after this release, a rev
            # run puts main (with these indexes) two patches above it again.
            beta=false
            if [ "$rev" -gt 0 ]; then beta=true; fi
            tag="v${major}.${minor}.${next}"
            if tag_taken "$tag"; then
              echo "::error::${tag} already exists; the weekly refresh never changes a release."
              exit 1
            fi
            commit=$(git rev-parse "refs/tags/${stable}^{commit}")
            # Build and test the released code, not main, so a timetable
            # release never ships unreleased card code (or an index schema the
            # released card cannot read). The new tag points at that same
            # commit, and it is published only when the indexes differ from
            # the stable release's own (the baseline).
            echo "Timetable refresh: ${stable} code, new indexes as ${tag} if a feed changed"
            emit "$tag" true "refs/tags/${stable}" "$stable" "$commit" true "$beta"
            exit 0
          fi

          stable=$(latest_stable)
          if [ -z "$stable" ]; then
            echo "No previous stable release; skip."
            emit "" false
            exit 0
          fi
          read -r major minor patch <<< "$(parse_semver "$stable")"
          bump="${BUMP:-rev}"
          rev=$(newest_rev "$major" "$minor" "$patch")
          if [ "$bump" = "major" ]; then
            tag="v$((major + 1)).0.0"
          elif [ "$bump" = "minor" ]; then
            tag="v${major}.$((minor + 1)).0"
          elif [ "$bump" = "patch" ]; then
            # main as a stable release takes the number of the open -rev
            # series, so what beta users ran ships under its own number.
            p=$((patch + 1))
            if [ "$rev" -gt "$p" ]; then p=$rev; fi
            tag="v${major}.${minor}.${p}"
          else
            # Live Lovelace as a prerelease, so HACS stable stays on the last
            # real release. Two patches up: the next patch is the weekly
            # timetable release's, which must rank below this (semver puts
            # X.Y.P above X.Y.P-rev.N). An open series that high continues.
            p=$((patch + 2))
            if [ "$rev" -gt "$p" ]; then p=$rev; fi
            base="${major}.${minor}.${p}"
            n=$(latest_rev_n "$base")
            tag="v${base}-rev.$((n + 1))"
          fi
          if tag_taken "$tag"; then
            echo "::error::${tag} already exists; release the next version instead."
            exit 1
          fi
          echo "Manual ${bump} from ${stable} -> ${tag}"
          emit "$tag" true "" "$latest"

  test:
    name: Tests
    needs: resolve
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      # What validate.yml checks on main, on the ref being released: the
      # release packs dist/ (dist/leaflet included). A weekly refresh of an
      # older tag may predate a check; what that tag does not have is skipped.
      - name: Vendored Leaflet matches its recorded hashes
        run: |
          set -euo pipefail
          if [ -f .github/vendored.sha256 ]; then sha256sum --check --strict .github/vendored.sha256; fi

      - name: Card tests, lint, bundle up to date with src/
        run: |
          set -euo pipefail
          npm ci
          npm run --if-present lint
          npm run build
          git diff --exit-code dist/
          npm test

      - name: Python lint
        run: |
          set -euo pipefail
          # The ruff rules the ref's own validate.yml runs, when it runs any.
          if grep -q 'ruff check' .github/workflows/validate.yml; then
            pip install ruff==0.16.10
            ruff check --target-version py312 --select E,F,W,B --ignore E501,B905 custom_components scripts
          fi

      - name: GTFS script and helper tests
        run: |
          set -euo pipefail
          for t in scripts/test_gtfs_compact.py scripts/test_update_volan_index.py scripts/test_build_guards.py \
              scripts/test_release_resolve.py scripts/test_release_mav_index.py scripts/test_release_workflow.py \
              ha/test_futar_limits.py ha/test_assets.py docs/manual/tools/test_server.py; do
            # A weekly refresh of an older tag may predate a test file.
            if [ -f "$t" ]; then python3 "$t"; fi
          done

      - name: Integration tests
        run: |
          set -euo pipefail
          pip install -r requirements_test.txt
          python -m pytest -q

  build:
    name: Build indexes and pack
    needs: resolve
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    # About 5 minutes; pfaedle has its own limit (release_mav_index.sh).
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    env:
      # Whether both MÁV secrets are set (true/false); the values themselves
      # are only in the step that downloads the feed.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
      # The MÁV build and the fallback's schema check import the
      # integration's package; no __pycache__ may end up in its zip.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The comparison script and the MÁV pipeline come from the workflow's
      # own commit (main on the weekly run), not from the tag being rebuilt:
      # older tags lack them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/index_digest.py
            scripts/release_mav_index.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The builders compare against the index already in place: a city feed
      # that vanished, most of a feed's trips gone or a near-empty Volán index
      # fails the run, and the published assets stay as they are.
      - name: Previous release indexes
        if: needs.resolve.outputs.baseline != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ needs.resolve.outputs.baseline }}
        run: |
          set -euo pipefail
          gh release download "$BASELINE" --repo "$GITHUB_REPOSITORY" \
            --pattern hungarian-transport-frontend.zip --dir baseline
          unzip -o -j baseline/hungarian-transport-frontend.zip volan-index.json.gz city-index.json.gz -d .
          # Kept aside: the builders rewrite these in place. The shapes
          # folders go with them, for the timetable comparison below (a
          # release before shapes has none: unzip exits 11, nothing matched).
          mkdir -p .baseline
          cp volan-index.json.gz city-index.json.gz .baseline/
          rc=0
          unzip -q -o baseline/hungarian-transport-frontend.zip 'volan-shapes-*' 'city-shapes-*' -d .baseline || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 11 ]; then exit "$rc"; fi
          # The MÁV index, when the release has one: the comparison below,
          # and what ships again should this run's MÁV build fail.
          rc=0
          unzip -q -o -j baseline/hungarian-transport-frontend.zip mav-index.json.gz -d .baseline || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 11 ]; then exit "$rc"; fi
          rm -rf baseline
          ls -l volan-index.json.gz city-index.json.gz .baseline/mav-index.json.gz 2>/dev/null || true

      - name: Build GTFS indexes
        env:
          BAHART_GTFS_URL: ${{ secrets.BAHART_GTFS_URL }}
          MOBILITY_DATABASE_REFRESH_TOKEN: ${{ secrets.MOBILITY_DATABASE_REFRESH_TOKEN }}
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
          ALLOW_MISSING_INPUT: ${{ github.event.inputs.allow_missing || '' }}
          ALLOW_MISSING_VAR: ${{ vars.HUNGARIAN_TRANSPORT_ALLOW_MISSING || '' }}
          VOLAN_GTFS_URL: ${{ vars.VOLAN_GTFS_URL || '' }}
        run: |
          set -euo pipefail
          # Both values end up in workflow commands below (::warning::,
          # ::notice::). A newline in them would start a command of its own,
          # so only feed ids, "all", commas and spaces get through; anything
          # else stops the run without echoing the value.
          for name in ALLOW_MISSING_INPUT ALLOW_MISSING_VAR; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_.,\ -]*$ ]]; then
              echo "::error title=Bad allow_missing::${name} may only hold feed ids, all, commas and spaces."
              exit 1
            fi
          done
          # The dispatch input relaxes the city guard for this run only, on
          # top of the repository variable. The variable relaxes it for every
          # run, the weekly refresh included, so say so on every run until it
          # is unset again.
          if [ -n "$ALLOW_MISSING_VAR" ]; then
            echo "::warning title=City index guard relaxed::Repository variable HUNGARIAN_TRANSPORT_ALLOW_MISSING='${ALLOW_MISSING_VAR}' lets every run drop these city feeds. Unset it once the feed is back."
          fi
          if [ -n "$ALLOW_MISSING_INPUT" ]; then
            echo "::notice::allow_missing='${ALLOW_MISSING_INPUT}' for this run."
          fi
          allow="$ALLOW_MISSING_VAR"
          if [ -n "$ALLOW_MISSING_INPUT" ]; then allow="${allow:+$allow,}$ALLOW_MISSING_INPUT"; fi
          export HUNGARIAN_TRANSPORT_ALLOW_MISSING="$allow"
          python3 scripts/build_volan_index.py
          python3 scripts/build_city_index.py
          mkdir -p dist
          cp -f volan-index.json.gz city-index.json.gz dist/
          # Sharded shapes.txt routes; each index names its folder ("sh").
          rm -rf dist/*-shapes-*/
          for d in volan-shapes-*/ city-shapes-*/; do
            if [ -d "$d" ]; then cp -r "$d" dist/; fi
          done
          ls -lh dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz

      # MÁV's GTFS needs a registered user: with the MAV_GTFS_USER and
      # MAV_GTFS_PASSWORD secrets the release ships a pfaedle-matched MÁV
      # index (release_mav_index.sh). Never one built on MÁV's own coarse
      # shapes. The extract is cached per ISO week, and saved only after a
      # MÁV build that went through: an extract that broke off or failed its
      # md5 is never kept for the week.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: osm-cache
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # Without the secrets, or when the download, pfaedle or the audit
      # fails, the release still goes out: with the previous release's MÁV
      # index when this code's card reads its schema, else with none. So a
      # weekly run without the secrets ships the same index and publishes
      # nothing for it.
      - name: MÁV index (pfaedle)
        id: mav
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: |
          set -euo pipefail
          rm -f mav-index.json.gz dist/mav-index.json.gz
          keep_baseline() {
            if [ ! -f .baseline/mav-index.json.gz ] || [ ! -f custom_components/hungarian_transport/mav_index.py ]; then
              return 1
            fi
            python3 - <<'PY' || return 1
          import gzip, json, sys
          sys.path.insert(0, "custom_components/hungarian_transport")
          import mav_index
          v = json.loads(gzip.decompress(open(".baseline/mav-index.json.gz", "rb").read())).get("v")
          sys.exit(0 if v == mav_index.SCHEMA else 1)
          PY
            cp -f .baseline/mav-index.json.gz dist/
          }
          if [ "$MAV_SECRETS" != "true" ]; then
            if keep_baseline; then
              echo "::notice title=MÁV index not rebuilt::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets; the previous release's mav-index.json.gz ships again."
            else
              echo "skip mav index (no MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets, no previous MÁV index this code reads)"
            fi
            exit 0
          fi
          if bash .release-tools/scripts/release_mav_index.sh "$RUNNER_TEMP/mav"; then
            cp -f mav-index.json.gz dist/
            ls -lh dist/mav-index.json.gz
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f mav-index.json.gz
          if keep_baseline; then
            echo "::warning title=MÁV index not rebuilt::The MÁV download, pfaedle or the audit failed (see this step's log); the previous release's mav-index.json.gz ships again."
          else
            echo "::warning title=No MÁV index::The MÁV download, pfaedle or the audit failed (see this step's log) and there is no previous MÁV index this code reads; this release has none."
          fi

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.MAV_SECRETS == 'true' && steps.mav.outputs.built == 'true' && steps.osm-cache.outputs.cache-hit != 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # A timetable refresh publishes only new data. The indexes are compared
      # by content: index_digest.py resolves every trip's stops, service and
      # shape and ignores row order, which the builders of older tags vary
      # from run to run (PYTHONHASHSEED), and with it the shapes folder name.
      # An index it cannot read counts as changed. The MÁV index (what ships,
      # in dist/) counts as changed when it appeared or differs. One that
      # went away is no change by itself (only the previous one this code
      # cannot read is dropped): it never publishes a release on its own.
      - name: Did a timetable change
        id: changed
        env:
          REFRESH: ${{ needs.resolve.outputs.refresh }}
        run: |
          set -euo pipefail
          if [ "$REFRESH" != "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=false
          for f in volan-index.json.gz city-index.json.gz dist/mav-index.json.gz; do
            name=$(basename "$f")
            if [ "$name" = "mav-index.json.gz" ] && [ ! -f "$f" ]; then
              if [ -f ".baseline/$name" ]; then
                echo "$name not in this build; not counted as a change"
              else
                echo "$name in neither release"
              fi
              continue
            fi
            new=""
            if [ -f "$f" ]; then
              new=$(python3 .release-tools/scripts/index_digest.py "$f" | cut -d' ' -f1) || new=""
            fi
            old=""
            if [ -f ".baseline/$name" ]; then
              old=$(python3 .release-tools/scripts/index_digest.py ".baseline/$name" | cut -d' ' -f1) || old=""
            fi
            if [ -z "$new" ] || [ "$new" != "$old" ]; then
              echo "$name changed"
              changed=true
            else
              echo "$name unchanged (${new})"
            fi
          done
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            echo "::notice title=No timetable change::The rebuilt indexes equal the latest release's; nothing is published."
          fi

      # How the city lines will draw: every stop pattern against its shapes.txt
      # route. Informational (the feeds decide), shown on the run summary; it
      # never fails the release, and a refresh of a tag without it skips it.
      - name: City route audit
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f scripts/audit_city_shapes.py ]; then
            echo "skip city route audit (not in this tag)"
            exit 0
          fi
          {
            echo "### City routes"
            echo '```'
            python3 scripts/audit_city_shapes.py city-index.json.gz
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stamp release and pack assets
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          ver="${tag#v}"
          export VER="$ver"
          python3 <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?", ver):
              raise SystemExit("bad ver")
          path = pathlib.Path("dist/hungarian-transport.js")
          text = path.read_text(encoding="utf-8")
          # Hand-written bundles used `const ... = '...'`; esbuild emits
          # `var ... = "..."`. Accept both so tag refreshes of old releases work.
          text, n = re.subn(
              r"""^(const|var|let) CARD_VERSION = (['"]).*\2;""",
              lambda m: '%s CARD_VERSION = %s%s%s;' % (m.group(1), m.group(2), ver, m.group(2)),
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("CARD_VERSION stamp failed")
          path.write_text(text, encoding="utf-8")
          PY
          mkdir -p custom_components/hungarian_transport/www
          cp dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz custom_components/hungarian_transport/www/
          if [ -f dist/mav-index.json.gz ]; then cp dist/mav-index.json.gz custom_components/hungarian_transport/www/; fi
          # The integration's entry module; releases before it load the bundle directly.
          if [ -f dist/hungarian-transport-loader.js ]; then cp dist/hungarian-transport-loader.js custom_components/hungarian_transport/www/; fi
          # Releases before the vendored Leaflet load it from unpkg; the weekly
          # refresh re-packs such a tag, which has no dist/leaflet.
          if [ -d dist/leaflet ]; then cp -r dist/leaflet custom_components/hungarian_transport/www/; fi
          for d in dist/*-shapes-*/; do
            if [ -d "$d" ]; then cp -r "$d" custom_components/hungarian_transport/www/; fi
          done
          python3 <<'PY'
          import json, os, pathlib
          path = pathlib.Path("custom_components/hungarian_transport/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VER"]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd custom_components/hungarian_transport && zip -qr9 ../../hungarian-transport.zip . -x '*__pycache__*' '*.pyc')
          frontend=(hungarian-transport.js volan-index.json.gz city-index.json.gz)
          if [ -d dist/leaflet ]; then frontend+=(leaflet); fi
          for d in dist/*-shapes-*/; do
            if [ -d "$d" ]; then frontend+=("$(basename "$d")/"); fi
          done
          if [ -f dist/mav-index.json.gz ]; then frontend+=(mav-index.json.gz); fi
          (cd dist && zip -9r ../hungarian-transport-frontend.zip "${frontend[@]}")
          ls -lh hungarian-transport.zip hungarian-transport-frontend.zip
          # The tag, manifest.json in the integration zip and CARD_VERSION in
          # both bundles must say the same version, or HACS and the card
          # disagree about what is installed.
          python3 - "$ver" <<'PY'
          import json, re, sys, zipfile
          ver = sys.argv[1]
          problems = []
          with zipfile.ZipFile("hungarian-transport.zip") as z:
              manifest = json.loads(z.read("manifest.json"))
              stray = [n for n in z.namelist() if "__pycache__" in n or n.endswith(".pyc")]
              if stray:
                  problems.append("bytecode in hungarian-transport.zip: " + ", ".join(stray[:5]))
              bundles = {"hungarian-transport.zip:www/hungarian-transport.js": z.read("www/hungarian-transport.js")}
          with zipfile.ZipFile("hungarian-transport-frontend.zip") as z:
              bundles["hungarian-transport-frontend.zip:hungarian-transport.js"] = z.read("hungarian-transport.js")
          if manifest.get("version") != ver:
              problems.append(f"manifest.json version {manifest.get('version')!r} != {ver}")
          for name, raw in bundles.items():
              m = re.search(r"""^(?:const|var|let) CARD_VERSION = (['"])(.*?)\1;""", raw.decode("utf-8"), re.M)
              found = m.group(2) if m else None
              if found != ver:
                  problems.append(f"{name} CARD_VERSION {found!r} != {ver}")
          if problems:
              print("::error title=Release version mismatch::" + "; ".join(problems))
              sys.exit(1)
          print(f"tag, manifest.json and CARD_VERSION agree on {ver}")
          PY
          # Shipped next to the zips: sha256sum -c SHA256SUMS checks a download.
          sha256sum hungarian-transport.zip hungarian-transport-frontend.zip > SHA256SUMS
          cat SHA256SUMS
          # The provenance attestation names the commit of the workflow run
          # (github.sha: main's head on the weekly run), not the tag commit the
          # zips were built from; actions/attest has no input for another
          # source commit. This file says which commit that was.
          python3 - <<'PY'
          import json, os, subprocess
          info = {
              "tag": os.environ["TAG"],
              "built_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "sha256": dict(reversed(line.split()) for line in open("SHA256SUMS", encoding="utf-8")),
          }
          with open("hungarian-transport-build.json", "w", encoding="utf-8") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")
          PY
          cat hungarian-transport-build.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            hungarian-transport.zip
            hungarian-transport-frontend.zip
            SHA256SUMS
            hungarian-transport-build.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [resolve, test, build]
    if: needs.resolve.outputs.create == 'true' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # build provenance attestation (Sigstore via OIDC) for the two zips
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      - name: Check the checksums of what is about to be published
        run: sha256sum -c SHA256SUMS

      # gh attestation verify hungarian-transport.zip --repo <owner>/<repo>
      # The attestation's source commit is this run's github.sha; on the
      # weekly refresh that is main, while the zips are built from the stable
      # tag's commit: hungarian-transport-build.json (uploaded with them)
      # names both.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            hungarian-transport.zip
            hungarian-transport-frontend.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ needs.resolve.outputs.target }}
          REFRESH: ${{ needs.resolve.outputs.refresh }}
          BASELINE: ${{ needs.resolve.outputs.baseline }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          if [[ ! "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "refusing target"
            exit 1
          fi
          # A tag push runs in a group of its own (see concurrency): a
          # dispatch or weekly run must not publish over a tag pushed since
          # it resolved its version.
          # Only a 404 means "no such tag" / "no such release"; any other API
          # failure stops the publish rather than guessing.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            if out=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .ref 2>&1); then
              echo "::error::Tag ${tag} exists already (pushed while this run was building); release the next version instead."
              exit 1
            elif [[ "$out" != *"HTTP 404"* ]]; then
              echo "::error::Could not check whether tag ${tag} exists (GitHub API); not publishing."
              exit 1
            fi
          fi
          ver="${tag#v}"
          notes="Hungarian transport ${ver}."
          extra=()
          if [[ "$tag" == *-rev.* ]]; then
            extra+=(--prerelease)
            notes="${notes} Live Lovelace revision between HACS releases."
          elif [ "$REFRESH" = "true" ]; then
            notes="${notes} Timetable update: fresh GTFS indexes (Volán, city, MÁV when built) on the code of ${BASELINE}."
          else
            notes="${notes} Includes fresh GTFS indexes (Volán, city, MÁV when built)."
          fi
          # A published release is never changed: what HACS installs as a
          # version stays what was released as it. A draft is refused too
          # (HACS never sees an unpublished release).
          if ! state=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1); then
            if [[ "$state" != *"release not found"* ]]; then
              echo "::error::Could not check whether release ${tag} exists (GitHub API); not publishing."
              exit 1
            fi
            state=missing
          fi
          if [ "$state" != "missing" ]; then
            echo "::error::Release $tag already exists (${state}). A release is not changed after publishing; release the next version instead."
            exit 1
          fi
          # Tag the commit that was built: main's head for a code release, the
          # stable tag's commit for a timetable refresh.
          gh release create "$tag" hungarian-transport.zip hungarian-transport-frontend.zip SHA256SUMS hungarian-transport-build.json --target "$TARGET" --title "$tag" --notes "$notes" "${extra[@]}"

  # After a weekly timetable release, while a -rev series is open (beta users
  # run it), publish main as the next rev, which starts two patches above
  # the new stable. Beta users then stay above the timetable release on
  # main's code (with the same fresh indexes) instead of being offered the
  # older code of the release that just went out. GITHUB_TOKEN may start a
  # workflow_dispatch run. That run is a rev, not a refresh, so its own beta
  # job is skipped: no loop.
  beta:
    name: Rev release for the beta channel
    needs: [resolve, publish]
    if: needs.resolve.outputs.refresh == 'true' && needs.resolve.outputs.beta == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch a rev release from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f bump=rev
          echo "::notice title=Beta channel::${TAG} is out; a rev release from main was dispatched so beta users stay above it."
