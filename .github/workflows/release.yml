name: Release

on:
  push:
    tags:
      - "v*"
  # Weekly: rebuild the GTFS indexes on the latest stable tag's code and
  # replace that release's zips in place (gh release upload --clobber), so
  # fresh downloads get current feeds without a version bump. On purpose;
  # each upload carries a matching SHA256SUMS, a build provenance
  # attestation and hungarian-transport-build.json, so a replaced asset can
  # still be checked. The attestation names the run's commit (main), the
  # build file names the tag commit the zips were built from.
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "rev = next patch as a -rev.N prerelease (e.g. 1.9.1-rev.1 after stable 1.9.0; HACS stable stays). patch/minor/major publish a stable release: only when asked."
        type: choice
        options:
          - rev
          - patch
          - minor
          - major
        default: rev
      allow_missing:
        description: "City feed ids (comma-separated, or all) the city index may lose against the previous release. Normally empty."
        type: string
        default: ""

# Only the publish job writes; the jobs that run npm, the builders and the
# downloaded GTFS feeds get a read-only token. Every action is pinned to a
# commit (the tag it was cut from in the comment), the publish job's
# download-artifact included; bump deliberately.
permissions:
  contents: read

# Two runs at once would race on the -rev.N number and on the release assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      create: ${{ steps.ver.outputs.create }}
      ref: ${{ steps.ver.outputs.ref }}
      baseline: ${{ steps.ver.outputs.baseline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing here pushes; gh gets its token from GH_TOKEN, not from .git/config.
          persist-credentials: false

      - name: Release from main only
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run the release from main, not ${GITHUB_REF}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main."
            exit 1
          fi

      - name: Resolve tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump || '' }}
        run: |
          set -euo pipefail

          # GitHub's latest release: the newest published one that is not a
          # prerelease, however many -rev.N came after it (24 after 1.4.2).
          # The full list is the fallback, should that one ever be a -rev tag.
          latest_stable() {
            local tag
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
            if [ -n "$tag" ] && [[ "$tag" != *-rev.* ]]; then
              echo "$tag"
              return 0
            fi
            gh release list --exclude-drafts --limit 1000 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease==false) | .tagName | select(test("-rev\\.")|not)][0] // empty'
          }

          latest_rev_n() {
            local base="$1"
            local n=0 t r
            while IFS= read -r t; do
              r="${t#v${base}-rev.}"
              if [[ "$r" =~ ^[0-9]+$ ]] && [ "$r" -gt "$n" ]; then n=$r; fi
            done < <(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' || true)
            echo "$n"
          }

          parse_semver() {
            local ver="${1#v}"
            ver="${ver%%-*}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            patch="${patch%%.*}"
            echo "${major:-0} ${minor:-0} ${patch:-0}"
          }

          # tag to publish, the code to build (ref) and the release whose
          # indexes the new ones replace (baseline).
          emit() {
            {
              echo "tag=${1}"
              echo "create=${2}"
              echo "ref=${3:-$GITHUB_SHA}"
              echo "baseline=${4:-}"
            } >> "$GITHUB_OUTPUT"
          }

          latest=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            emit "${GITHUB_REF_NAME}" true "" "$latest"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            tag=$(latest_stable)
            if [ -z "$tag" ]; then
              echo "No stable release to refresh; skip."
              emit "" false
              exit 0
            fi
            echo "Refreshing GTFS zip on ${tag} (no version bump)"
            # Build and test the released code, not main, so the zip never ships
            # unreleased card code (or an index schema the released card cannot
            # read) under an old version. Its own indexes are the baseline.
            emit "$tag" true "refs/tags/${tag}" "$tag"
            exit 0
          fi

          stable=$(latest_stable)
          if [ -z "$stable" ]; then
            echo "No previous stable release; skip."
            emit "" false
            exit 0
          fi
          read -r major minor patch <<< "$(parse_semver "$stable")"
          bump="${BUMP:-rev}"
          if [ "$bump" = "major" ]; then
            tag="v$((major + 1)).0.0"
          elif [ "$bump" = "minor" ]; then
            tag="v${major}.$((minor + 1)).0"
          elif [ "$bump" = "patch" ]; then
            tag="v${major}.${minor}.$((patch + 1))"
          else
            # Live Lovelace is the next patch, published only as a prerelease,
            # so HACS stable stays on the last real release.
            base="${major}.${minor}.$((patch + 1))"
            n=$(latest_rev_n "$base")
            tag="v${base}-rev.$((n + 1))"
          fi
          echo "Manual ${bump} from ${stable} -> ${tag}"
          emit "$tag" true "" "$latest"

  test:
    name: Tests
    needs: resolve
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Card tests, bundle up to date with src/
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --exit-code dist/
          npm test

      - name: GTFS script tests
        run: |
          set -euo pipefail
          for t in scripts/test_gtfs_compact.py scripts/test_update_volan_index.py scripts/test_build_guards.py; do
            # A weekly refresh of an older tag may predate a test file.
            if [ -f "$t" ]; then python3 "$t"; fi
          done

      - name: Integration tests
        run: |
          set -euo pipefail
          pip install -r requirements_test.txt
          python -m pytest -q

  build:
    name: Build indexes and pack
    needs: resolve
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The builders compare against the index already in place: a city feed
      # that vanished, most of a feed's trips gone or a near-empty Volán index
      # fails the run, and the published assets stay as they are.
      - name: Previous release indexes
        if: needs.resolve.outputs.baseline != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ needs.resolve.outputs.baseline }}
        run: |
          set -euo pipefail
          gh release download "$BASELINE" --repo "$GITHUB_REPOSITORY" \
            --pattern hungarian-transport-frontend.zip --dir baseline
          unzip -o -j baseline/hungarian-transport-frontend.zip volan-index.json.gz city-index.json.gz -d .
          rm -rf baseline
          ls -l volan-index.json.gz city-index.json.gz

      - name: Build GTFS indexes
        env:
          BAHART_GTFS_URL: ${{ secrets.BAHART_GTFS_URL }}
          MOBILITY_DATABASE_REFRESH_TOKEN: ${{ secrets.MOBILITY_DATABASE_REFRESH_TOKEN }}
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
          ALLOW_MISSING_INPUT: ${{ github.event.inputs.allow_missing || '' }}
          ALLOW_MISSING_VAR: ${{ vars.HUNGARIAN_TRANSPORT_ALLOW_MISSING || '' }}
        run: |
          set -euo pipefail
          # Both values end up in workflow commands below (::warning::,
          # ::notice::). A newline in them would start a command of its own,
          # so only feed ids, "all", commas and spaces get through; anything
          # else stops the run without echoing the value.
          for name in ALLOW_MISSING_INPUT ALLOW_MISSING_VAR; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_.,\ -]*$ ]]; then
              echo "::error title=Bad allow_missing::${name} may only hold feed ids, all, commas and spaces."
              exit 1
            fi
          done
          # The dispatch input relaxes the city guard for this run only, on
          # top of the repository variable. The variable relaxes it for every
          # run, the weekly refresh included, so say so on every run until it
          # is unset again.
          if [ -n "$ALLOW_MISSING_VAR" ]; then
            echo "::warning title=City index guard relaxed::Repository variable HUNGARIAN_TRANSPORT_ALLOW_MISSING='${ALLOW_MISSING_VAR}' lets every run drop these city feeds. Unset it once the feed is back."
          fi
          if [ -n "$ALLOW_MISSING_INPUT" ]; then
            echo "::notice::allow_missing='${ALLOW_MISSING_INPUT}' for this run."
          fi
          allow="$ALLOW_MISSING_VAR"
          if [ -n "$ALLOW_MISSING_INPUT" ]; then allow="${allow:+$allow,}$ALLOW_MISSING_INPUT"; fi
          export HUNGARIAN_TRANSPORT_ALLOW_MISSING="$allow"
          python3 scripts/build_volan_index.py
          python3 scripts/build_city_index.py
          if [ -d pfaedle-out ] || [ -d /opt/pfaedle-trial/out ]; then
            python3 scripts/build_mav_index.py
          else
            echo "skip mav index (no pfaedle on runner; do not ship an official-zip chord)"
          fi
          mkdir -p dist
          cp -f volan-index.json.gz city-index.json.gz dist/
          # Sharded shapes.txt routes; each index names its folder ("sh").
          rm -rf dist/*-shapes-*/
          for d in volan-shapes-*/ city-shapes-*/; do
            if [ -d "$d" ]; then cp -r "$d" dist/; fi
          done
          if [ -f mav-index.json.gz ]; then cp -f mav-index.json.gz dist/; fi
          ls -lh dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz dist/mav-index.json.gz 2>/dev/null || true

      # How the city lines will draw: every stop pattern against its shapes.txt
      # route. Informational (the feeds decide), shown on the run summary; it
      # never fails the release, and a refresh of a tag without it skips it.
      - name: City route audit
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f scripts/audit_city_shapes.py ]; then
            echo "skip city route audit (not in this tag)"
            exit 0
          fi
          {
            echo "### City routes"
            echo '```'
            python3 scripts/audit_city_shapes.py city-index.json.gz
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stamp release and pack assets
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          ver="${tag#v}"
          export VER="$ver"
          python3 <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?", ver):
              raise SystemExit("bad ver")
          path = pathlib.Path("dist/hungarian-transport.js")
          text = path.read_text(encoding="utf-8")
          # Hand-written bundles used `const ... = '...'`; esbuild emits
          # `var ... = "..."`. Accept both so tag refreshes of old releases work.
          text, n = re.subn(
              r"""^(const|var|let) CARD_VERSION = (['"]).*\2;""",
              lambda m: '%s CARD_VERSION = %s%s%s;' % (m.group(1), m.group(2), ver, m.group(2)),
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("CARD_VERSION stamp failed")
          path.write_text(text, encoding="utf-8")
          PY
          mkdir -p custom_components/hungarian_transport/www
          cp dist/hungarian-transport.js dist/volan-index.json.gz dist/city-index.json.gz custom_components/hungarian_transport/www/
          if [ -f dist/mav-index.json.gz ]; then cp dist/mav-index.json.gz custom_components/hungarian_transport/www/; fi
          # The integration's entry module; releases before it load the bundle directly.
          if [ -f dist/hungarian-transport-loader.js ]; then cp dist/hungarian-transport-loader.js custom_components/hungarian_transport/www/; fi
          # Releases before the vendored Leaflet load it from unpkg; the weekly
          # refresh re-packs such a tag, which has no dist/leaflet.
          if [ -d dist/leaflet ]; then cp -r dist/leaflet custom_components/hungarian_transport/www/; fi
          for d in dist/*-shapes-*/; do
            if [ -d "$d" ]; then cp -r "$d" custom_components/hungarian_transport/www/; fi
          done
          python3 <<'PY'
          import json, os, pathlib
          path = pathlib.Path("custom_components/hungarian_transport/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VER"]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd custom_components/hungarian_transport && zip -qr9 ../../hungarian-transport.zip .)
          (cd dist && zip -9r ../hungarian-transport-frontend.zip hungarian-transport.js volan-index.json.gz city-index.json.gz $( [ -d leaflet ] && echo leaflet ) $(ls -d *-shapes-*/ 2>/dev/null) $( [ -f mav-index.json.gz ] && echo mav-index.json.gz ))
          ls -lh hungarian-transport.zip hungarian-transport-frontend.zip
          # The tag, manifest.json in the integration zip and CARD_VERSION in
          # both bundles must say the same version, or HACS and the card
          # disagree about what is installed.
          python3 - "$ver" <<'PY'
          import json, re, sys, zipfile
          ver = sys.argv[1]
          problems = []
          with zipfile.ZipFile("hungarian-transport.zip") as z:
              manifest = json.loads(z.read("manifest.json"))
              bundles = {"hungarian-transport.zip:www/hungarian-transport.js": z.read("www/hungarian-transport.js")}
          with zipfile.ZipFile("hungarian-transport-frontend.zip") as z:
              bundles["hungarian-transport-frontend.zip:hungarian-transport.js"] = z.read("hungarian-transport.js")
          if manifest.get("version") != ver:
              problems.append(f"manifest.json version {manifest.get('version')!r} != {ver}")
          for name, raw in bundles.items():
              m = re.search(r"""^(?:const|var|let) CARD_VERSION = (['"])(.*?)\1;""", raw.decode("utf-8"), re.M)
              found = m.group(2) if m else None
              if found != ver:
                  problems.append(f"{name} CARD_VERSION {found!r} != {ver}")
          if problems:
              print("::error title=Release version mismatch::" + "; ".join(problems))
              sys.exit(1)
          print(f"tag, manifest.json and CARD_VERSION agree on {ver}")
          PY
          # Shipped next to the zips (the weekly refresh replaces them in
          # place): sha256sum -c SHA256SUMS checks a download.
          sha256sum hungarian-transport.zip hungarian-transport-frontend.zip > SHA256SUMS
          cat SHA256SUMS
          # The provenance attestation names the commit of the workflow run
          # (github.sha: main's head on the weekly run), not the tag that was
          # built; actions/attest has no input for another source commit. This
          # file says which commit the zips were built from.
          python3 - <<'PY'
          import json, os, subprocess
          info = {
              "tag": os.environ["TAG"],
              "built_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "sha256": dict(reversed(line.split()) for line in open("SHA256SUMS", encoding="utf-8")),
          }
          with open("hungarian-transport-build.json", "w", encoding="utf-8") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")
          PY
          cat hungarian-transport-build.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            hungarian-transport.zip
            hungarian-transport-frontend.zip
            SHA256SUMS
            hungarian-transport-build.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [resolve, test, build]
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # build provenance attestation (Sigstore via OIDC) for the two zips
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      - name: Check the checksums of what is about to be published
        run: sha256sum -c SHA256SUMS

      # gh attestation verify hungarian-transport.zip --repo <owner>/<repo>
      # The attestation's source commit is this run's github.sha; on the
      # weekly refresh that is main, while the zips are built from the tag:
      # hungarian-transport-build.json (uploaded with them) names both.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            hungarian-transport.zip
            hungarian-transport-frontend.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rev\.[0-9]+)?$ ]]; then
            echo "refusing tag"
            exit 1
          fi
          ver="${tag#v}"
          notes="Hungarian transport ${ver}."
          extra=()
          if [[ "$tag" == *-rev.* ]]; then
            extra+=(--prerelease)
            notes="${notes} Live Lovelace revision between HACS releases."
          else
            notes="${notes} Includes fresh Volán and city GTFS indexes."
          fi
          # An upload into a draft release leaves it unpublished (and HACS
          # never sees it); refuse instead of quietly succeeding.
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = "true" ]; then
            echo "::error::Release $tag exists as a draft. Publish or delete the draft, then rerun."
            exit 1
          elif [ "$draft" = "false" ]; then
            gh release upload "$tag" hungarian-transport.zip hungarian-transport-frontend.zip SHA256SUMS hungarian-transport-build.json --clobber
          else
            # Tag the commit that was built, not whatever the default branch is now.
            gh release create "$tag" hungarian-transport.zip hungarian-transport-frontend.zip SHA256SUMS hungarian-transport-build.json --target "$GITHUB_SHA" --title "$tag" --notes "$notes" "${extra[@]}"
          fi
