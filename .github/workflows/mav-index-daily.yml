name: Daily MÁV index

# MÁV publishes a new GTFS almost every day; releases ship its index weekly.
# Every morning, after MÁV's nightly feed update, this builds the index the
# release builds (release_mav_index.sh: MÁV GTFS, pfaedle, build_mav_index.py
# and its audit) and publishes it on GitHub Pages with a manifest
# (scripts/mav_pages_site.py). The integration fetches the manifest, and the
# index when its feed is newer (custom_components/hungarian_transport/
# mav_daily.py). The site also carries the build's GTFS for other consumers:
# MÁV's zip as downloaded (mav-gtfs.zip, CC0) and pfaedle's trips, shapes and
# stop_times (mav-pfaedle-overlay.zip, shapes © OpenStreetMap contributors,
# ODbL), with ATTRIBUTION.txt. 03:15 UTC: ready before 05:30 local time.
#
# Nothing is deployed, and the site keeps the previous files, when the
# secrets are missing, the download, pfaedle or the audit fails, the site is
# refused (mav_pages_site.py: a bad feed date, over 500 MB), or the index and
# the GTFS files have the content Pages already serves. A run that published
# nothing because something failed stays green with a ::warning:: only while
# the published manifest is less than 2 days old; it fails at once when MÁV
# refused the login (401/403: only new credentials help), and when the
# published index is 2 days old or older (scripts/mav_daily_verdict.py).
# GitHub Pages must be enabled with "Source: GitHub Actions"; until then the
# deploy job fails with an error saying so, and nothing else changes.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a second one waits instead of racing the deploy.
concurrency:
  group: mav-index-daily
  cancel-in-progress: false

jobs:
  build:
    name: Build the MÁV index with pfaedle
    runs-on: ubuntu-latest
    # About 5 minutes; pfaedle has its own limit (release_mav_index.sh).
    timeout-minutes: 40
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    env:
      # Only whether both are set; the values stay in the step that uses them.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
      # The build imports the integration's package from the checkout.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: No MÁV credentials
        if: env.MAV_SECRETS != 'true'
        run: echo "::warning title=Daily MÁV index not built::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets; GitHub Pages keeps the previous index."

      # Also without the secrets: the last step checks how old the
      # published index is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The extract cache the release and the PR check use (one per ISO
      # week), saved only after a build that went through.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: osm-cache
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      - name: MÁV GTFS, pfaedle, build and audit
        id: mav
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: |
          set -euo pipefail
          rm -f mav-index.json.gz mav-build.json
          rc=0
          bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f mav-index.json.gz
          # 77: MÁV refused the login (release_mav_index.sh); the last step
          # fails the run on it.
          if [ "$rc" -eq 77 ]; then
            echo "failure=auth" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::MÁV refused the login (HTTP 401/403, see this step's log); GitHub Pages keeps the previous index."
          else
            echo "failure=build" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::The MÁV download, pfaedle or the audit failed (see this step's log); GitHub Pages keeps the previous index."
          fi

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.MAV_SECRETS == 'true' && steps.mav.outputs.built == 'true' && steps.osm-cache.outputs.cache-hit != 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # The manifest, and whether the content differs from what Pages serves
      # (the live manifest's content digest and GTFS digests). The MÁV zip
      # and pfaedle's output are the ones release_mav_index.sh left in its
      # work dir for this build.
      - name: Pages site
        id: site
        if: steps.mav.outputs.built == 'true'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          if python3 scripts/mav_pages_site.py --index mav-index.json.gz --stats mav-build.json \
              --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/site" --live-url "$pages_url/mav-index.json" \
              --gtfs-zip "$RUNNER_TEMP/mav/gtfs/mav-gtfs.zip" --pfaedle-dir "$RUNNER_TEMP/mav/gtfs-out" \
              --github-output "$GITHUB_OUTPUT"; then
            ls -l "$RUNNER_TEMP/site"
            exit 0
          fi
          echo "::warning title=Daily MÁV index not published::The built index did not make a Pages site (see this step's log); GitHub Pages keeps the previous index."

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.site.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/site

      # No site was made (no secrets, a failed build, a refused site): the
      # previous one stays on Pages, and nothing is deployed. Red at once
      # for a refused login, and when the published index is 2 days old or
      # older; a warning otherwise.
      - name: Published index age
        if: steps.site.outputs.deploy == ''
        env:
          BUILD_FAILURE: ${{ steps.mav.outputs.failure }}
        run: |
          set -euo pipefail
          if [ "$MAV_SECRETS" != true ]; then
            failure=secrets
          elif [ -n "${BUILD_FAILURE:-}" ]; then
            failure="$BUILD_FAILURE"
          else
            failure=site
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 scripts/mav_daily_verdict.py --failure "$failure" --live-url "$pages_url/mav-index.json"

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may deploy; it runs no code from the checkout.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages fails on a repository without Pages with an error that
      # does not say what to do; this one does. Only a 404 means "not
      # enabled": any other answer leaves the decision to deploy-pages.
      - name: GitHub Pages enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          err="$RUNNER_TEMP/pages-check.err"
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$err"); then
            if [ "$build_type" != "workflow" ]; then
              echo "::error title=GitHub Pages source is not GitHub Actions::Settings, Pages, Build and deployment: set Source to GitHub Actions (now: ${build_type}). Nothing was published."
              exit 1
            fi
            echo "GitHub Pages: source GitHub Actions"
          elif grep -q "HTTP 404" "$err"; then
            echo "::error title=GitHub Pages is not enabled::Settings, Pages, Build and deployment: set Source to GitHub Actions, then run this workflow again. Nothing was published."
            exit 1
          else
            echo "::warning::Could not read the Pages settings ($(head -c 200 "$err" | tr -d '\r\n')); deploying anyway."
          fi

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
