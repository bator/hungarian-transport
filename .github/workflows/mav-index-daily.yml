name: Daily MÁV index

# MÁV publishes a new GTFS almost every day; releases ship its index weekly.
# This builds the index the release builds (release_mav_index.sh: MÁV GTFS,
# pfaedle, build_mav_index.py and its audit) and publishes it on GitHub
# Pages with a manifest (scripts/mav_pages_site.py). The integration fetches
# the manifest, and the index when its feed is newer
# (custom_components/hungarian_transport/mav_daily.py). The site also
# carries the build's GTFS for other consumers: MÁV's zip as downloaded
# (mav-gtfs.zip, CC0) and pfaedle's trips, shapes and stop_times
# (mav-pfaedle-overlay.zip, shapes © OpenStreetMap contributors, ODbL), with
# ATTRIBUTION.txt.
#
# When: MÁV's feed of the day (feed_version YYYYMMDD) appeared between about
# 03:17 and 10:03 UTC in November 2026, and on 3 November it was still
# missing at 13:54. GitHub starts scheduled runs late: the 03:15 cron of 2-15
# November started at 10:03-11:28 UTC, 7 to 8 hours late, so no time here is
# a promise. Two crons:
# - 04:45 UTC, the morning build. On time it may find yesterday's feed;
#   started as late as the 03:15 one was, it lands around 11:30-13:00 UTC,
#   when the day's feed is out. Public installations (HACS) have only these
#   runs.
# - 14:20 UTC, the catch-up for a feed MÁV publishes in the afternoon (after
#   13:54); even 8 hours late it starts before midnight in Budapest in
#   winter.
# A workflow_dispatch may come on top (the repository owner's own server
# sends one at 11:30 Budapest time: 10:30 UTC in winter, 09:30 in summer).
# The concurrency group below holds one running and one pending run, and a
# third arrival cancels the pending one: so at most one cron may start before
# 11:30 UTC (a run never starts early, and any of them may start late enough
# to meet the dispatch). Only the 04:45 one can reach 09:30-11:30; the 14:20
# one never does.
#
# Nothing is deployed, and the site keeps the previous files, when the
# secrets are missing, the download, pfaedle or the audit fails, the site is
# refused (mav_pages_site.py: a bad feed date, over 500 MB), or the index and
# MÁV's zip are the ones Pages already serves and its manifest was built less
# than 12 hours ago (older, the same content is deployed again, so built_at
# stays the last run that went through). pfaedle's overlay is not compared:
# its bytes differ on every run, even for the same feed. A run that published
# nothing because something failed stays green with a ::warning:: only while
# the published manifest is less than 2 days old; it fails at once when MÁV
# refused the login (401/403: only new credentials help), and when the
# published index is 2 days old or older (scripts/mav_daily_verdict.py).
# GitHub Pages must be enabled with "Source: GitHub Actions"; until then the
# deploy job fails with an error saying so, and nothing else changes.
on:
  schedule:
    - cron: "45 4 * * *"
    - cron: "20 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a second one waits instead of racing the deploy.
concurrency:
  group: mav-index-daily
  cancel-in-progress: false

jobs:
  build:
    name: Build the MÁV index with pfaedle
    runs-on: ubuntu-latest
    # About 5 minutes; pfaedle has its own limit (release_mav_index.sh).
    timeout-minutes: 40
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    env:
      # Only whether both are set; the values stay in the step that uses them.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
      # The build imports the integration's package from the checkout.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: No MÁV credentials
        if: env.MAV_SECRETS != 'true'
        run: echo "::warning title=Daily MÁV index not built::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets; GitHub Pages keeps the previous index."

      # Also without the secrets: the last step checks how old the
      # published index is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The extract cache the release and the PR check use (one per ISO
      # week), saved only after a build that went through.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm-cache
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      - name: MÁV GTFS, pfaedle, build and audit
        id: mav
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: |
          set -euo pipefail
          rm -f mav-index.json.gz mav-build.json
          rc=0
          bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f mav-index.json.gz
          # 77: MÁV refused the login (release_mav_index.sh); the last step
          # fails the run on it.
          if [ "$rc" -eq 77 ]; then
            echo "failure=auth" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::MÁV refused the login (HTTP 401/403, see this step's log); GitHub Pages keeps the previous index."
          else
            echo "failure=build" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::The MÁV download, pfaedle or the audit failed (see this step's log); GitHub Pages keeps the previous index."
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.MAV_SECRETS == 'true' && steps.mav.outputs.built == 'true' && steps.osm-cache.outputs.cache-hit != 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # The manifest, and whether the content differs from what Pages serves
      # (the live manifest's content digest and the MÁV zip's size and
      # sha256; not the overlay's, which pfaedle never writes the same
      # twice) or the live manifest is old enough to refresh (REFRESH_AFTER).
      # The MÁV zip and pfaedle's output are the ones release_mav_index.sh
      # left in its work dir for this build. An index with under half the
      # trains and lines of the published one is refused
      # (mav_shrink_guard.py); when the published manifest does not read,
      # it is compared with the latest stable release's MÁV index instead
      # (fetched only then). The repository variable MAV_ALLOW_SHRINK=1
      # accepts an intended reduction.
      - name: Pages site
        id: site
        if: steps.mav.outputs.built == 'true'
        env:
          MAV_ALLOW_SHRINK: ${{ vars.MAV_ALLOW_SHRINK || '' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          if python3 scripts/mav_pages_site.py --index mav-index.json.gz --stats mav-build.json \
              --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/site" --live-url "$pages_url/mav-index.json" \
              --gtfs-zip "$RUNNER_TEMP/mav/gtfs/mav-gtfs.zip" --pfaedle-dir "$RUNNER_TEMP/mav/gtfs-out" \
              --baseline-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hungarian-transport-frontend.zip" \
              --github-output "$GITHUB_OUTPUT"; then
            ls -l "$RUNNER_TEMP/site"
            exit 0
          fi
          echo "::warning title=Daily MÁV index not published::The built index did not make a Pages site (see this step's log); GitHub Pages keeps the previous index."

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.site.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/site

      # No site was made (no secrets, a failed build, a refused site): the
      # previous one stays on Pages, and nothing is deployed. Red at once
      # for a refused login, and when the published index is 2 days old or
      # older; a warning otherwise.
      - name: Published index age
        if: steps.site.outputs.deploy == ''
        env:
          BUILD_FAILURE: ${{ steps.mav.outputs.failure }}
        run: |
          set -euo pipefail
          if [ "$MAV_SECRETS" != true ]; then
            failure=secrets
          elif [ -n "${BUILD_FAILURE:-}" ]; then
            failure="$BUILD_FAILURE"
          else
            failure=site
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 scripts/mav_daily_verdict.py --failure "$failure" --live-url "$pages_url/mav-index.json"

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may deploy and attest; it runs no code from the checkout.
    permissions:
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages fails on a repository without Pages with an error that
      # does not say what to do; this one does. Only a 404 means "not
      # enabled": any other answer leaves the decision to deploy-pages.
      - name: GitHub Pages enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          err="$RUNNER_TEMP/pages-check.err"
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$err"); then
            if [ "$build_type" != "workflow" ]; then
              echo "::error title=GitHub Pages source is not GitHub Actions::Settings, Pages, Build and deployment: set Source to GitHub Actions (now: ${build_type}). Nothing was published."
              exit 1
            fi
            echo "GitHub Pages: source GitHub Actions"
          elif grep -q "HTTP 404" "$err"; then
            echo "::error title=GitHub Pages is not enabled::Settings, Pages, Build and deployment: set Source to GitHub Actions, then run this workflow again. Nothing was published."
            exit 1
          else
            echo "::warning::Could not read the Pages settings ($(head -c 200 "$err" | tr -d '\r\n')); deploying anyway."
          fi

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      # A build provenance attestation (Sigstore, signed with this job's OIDC
      # token) of the files just deployed, taken from the artifact Pages
      # deployed, not rebuilt. Check a download with
      #   gh attestation verify mav-index.json.gz --repo bator/hungarian-transport \
      #     --signer-workflow bator/hungarian-transport/.github/workflows/mav-index-daily.yml
      # After the deploy: a Sigstore outage turns the run red but never
      # holds back the day's index; a file without an attestation fails that
      # check, it never passes it. The integration does not verify it (it
      # would need a Sigstore client in Home Assistant); it checks the
      # index against the manifest's sha256 (mav_daily.py).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Unpack the deployed site
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/site"
          for f in mav-index.json.gz mav-index.json mav-gtfs.zip mav-pfaedle-overlay.zip; do
            test -f "$RUNNER_TEMP/site/$f" || { echo "::error::$f is not in the deployed site"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/site"

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/site/mav-index.json.gz
            ${{ runner.temp }}/site/mav-index.json
            ${{ runner.temp }}/site/mav-gtfs.zip
            ${{ runner.temp }}/site/mav-pfaedle-overlay.zip
