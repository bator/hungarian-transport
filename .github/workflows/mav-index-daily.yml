name: Daily timetables (GitHub Pages)

# MÁV publishes a new GTFS almost every day; a release ships its index only
# with new code, so between releases this workflow publishes it every day.
# The build job builds the index the release builds (release_mav_index.sh:
# MÁV GTFS, pfaedle, build_mav_index.py and its audit) and its part of the
# GitHub Pages site with a manifest (scripts/mav_pages_site.py). The
# integration fetches the manifest, and the index when its feed is newer
# (custom_components/hungarian_transport/mav_daily.py). The site also
# carries the build's GTFS for other consumers: MÁV's zip as downloaded
# (mav-gtfs.zip, CC0) and pfaedle's trips, shapes and stop_times
# (mav-pfaedle-overlay.zip, shapes © OpenStreetMap contributors, ODbL).
#
# The Volán and city indexes are timetable data too, and releases are for
# code: the timetables job rebuilds each of them here once a week (when the
# published one is 6 days 12 hours old or missing, or was built against
# another release than the latest stable one: another release_feed (the
# release's index feed) or release_version (its tag, by which installs
# decide); both when the manifest is missing or of another schema, or
# the dispatch input timetables asks for it, as release.yml's does after a
# stable release) with the release's builders and guards, and the
# integration installs them from the same site (weekly_timetables.py, by
# timetables.json and its signature timetables.json.sig). The
# builders are the latest stable release's (the highest vX.Y.Z that is no
# prerelease, checked out at the workspace root), never main's: what
# installs read must come from released code, as the weekly timetable
# release before this built them with its stable tag's code. Only
# pages_timetables.py comes from the workflow's commit (.pages-tools), and
# the index schema it checks is the stable release's. Without a stable
# release nothing is built. A builder that fails drops only its own index
# from this run; the published one stays.
#
# Every Pages deploy replaces the whole site, so the site job assembles it
# from this run's new parts and everything else carried over from the live
# site, each file checked against its published manifest's size and sha256
# (scripts/pages_timetables.py), and writes timetables.json, ATTRIBUTION.txt
# and index.html for the whole site; the sign job then signs
# timetables.json and mav-index.json (ed25519, scripts/sign_manifest.py,
# the github-pages environment's PAGES_SIGNING_KEY secret, main only): no
# deploy without signatures that verify against the public key the
# integration pins. A published manifest whose own signature does not
# verify is taken as none: nothing is carried from it; for timetables.json
# both indexes are rebuilt, for mav-index.json the build job publishes the
# day's index from its own build (and without one nothing is deployed: the
# site cannot go without the MÁV files). A .sig that is there but does not
# verify, also read again with its manifest 11 minutes after the step's
# first read of the site (Pages' CDN caches each file on its own for up to
# 10 minutes, so right after a deploy it may pair one deploy's manifest
# with the other's .sig: pages_timetables.py SIG_SETTLE_S), turns the run
# red (the signatures job, after the deploy that replaces it); one that is not there
# (404: the first run after signing came in) is a warning. A
# published Volán or city index that
# cannot be carried is left out with a warning (installs keep theirs, the
# next run rebuilds it). A MÁV file that cannot be carried, or a published
# manifest that is there but does not read, stops the deploy: every
# install's daily MÁV check reads those files. A manifest that is not there
# (404) has nothing to carry.
#
# When: MÁV's feed of the day (feed_version YYYYMMDD) appeared between about
# 03:17 and 10:03 UTC in November 2026, and on 3 November it was still
# missing at 13:54. GitHub starts scheduled runs late: the 03:15 cron of 2-15
# November started at 10:03-11:28 UTC, 7 to 8 hours late, so no time here is
# a promise. Two crons:
# - 04:45 UTC, the morning build. On time it may find yesterday's feed;
#   started as late as the 03:15 one was, it lands around 11:30-13:00 UTC,
#   when the day's feed is out. Public installations (HACS) have only these
#   runs.
# - 14:20 UTC, the catch-up for a feed MÁV publishes in the afternoon (after
#   13:54); even 8 hours late it starts before midnight in Budapest in
#   winter.
# A workflow_dispatch may come on top (the repository owner's own server
# sends one at 11:30 Budapest time: 10:30 UTC in winter, 09:30 in summer).
# The concurrency group below holds one running and one pending run, and a
# third arrival cancels the pending one: so at most one cron may start before
# 11:30 UTC (a run never starts early, and any of them may start late enough
# to meet the dispatch). Only the 04:45 one can reach 09:30-11:30; the 14:20
# one never does. A re-run (of the attest job, say) joins the same group: made
# while one run is in progress and another waits, it cancels the waiting one,
# which may be the dispatch. Re-run when no run of this workflow is queued.
#
# The MÁV part is not made, and the site keeps the previous MÁV files, when
# the secrets are missing, the download, pfaedle or the audit fails, the part
# is refused (mav_pages_site.py: a bad feed date, over 500 MB), or the index
# and MÁV's zip are the ones Pages already serves and its manifest was built
# less than 12 hours ago (older, the same content is deployed again, so
# built_at stays the last run that went through). Nothing is deployed when
# neither the MÁV part nor a Volán or city index is new. pfaedle's overlay is not compared:
# its bytes differ on every run, even for the same feed. A run that published
# nothing because something failed stays green with a ::warning:: only while
# the published manifest is less than 2 days old; it fails at once when MÁV
# refused the login (401/403: only new credentials help), and when the
# published index is 2 days old or older (scripts/mav_daily_verdict.py).
# The build and timetables jobs run side by side; the run (and so the
# concurrency below) lasts as long as the longer of them, plus the site and
# deploy jobs, the timing above unchanged. The site job runs unless the run
# itself is cancelled: a job that failed or ran out of time only makes no
# part, and the published files are carried over in its place.
# GitHub Pages must be enabled with "Source: GitHub Actions"; until then the
# deploy job fails with an error saying so, and nothing else changes.
on:
  schedule:
    - cron: "45 4 * * *"
    - cron: "20 14 * * *"
  workflow_dispatch:
    inputs:
      timetables:
        description: Rebuild the Volán and city indexes now
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time; a second one waits instead of racing the deploy.
concurrency:
  group: mav-index-daily
  cancel-in-progress: false

jobs:
  build:
    name: Build the MÁV index with pfaedle
    runs-on: ubuntu-latest
    # About 5 minutes; pfaedle has its own limit (release_mav_index.sh). Up
    # to 11 minutes more in each of the Pages site and Published index age
    # steps when the published mav-index.json.sig does not verify or is not
    # there (read again past Pages' cache).
    timeout-minutes: 55
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
      # The published mav-index.json's built_at, its signature verified
      # (mav_pages_site.py), "" without one: the site job never carries an
      # older one.
      live_built: ${{ steps.site.outputs.live_built }}
    env:
      # Only whether both are set; the values stay in the step that uses them.
      MAV_SECRETS: ${{ secrets.MAV_GTFS_USER != '' && secrets.MAV_GTFS_PASSWORD != '' }}
      # The build imports the integration's package from the checkout.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: No MÁV credentials
        if: env.MAV_SECRETS != 'true'
        run: echo "::warning title=Daily MÁV index not built::No MAV_GTFS_USER / MAV_GTFS_PASSWORD secrets; GitHub Pages keeps the previous index."

      # Also without the secrets: the last step checks how old the
      # published index is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The extract cache the release and the PR check use (one per ISO
      # week), saved only after a build that went through.
      - name: OSM cache week
        id: week
        if: env.MAV_SECRETS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm-cache
        if: env.MAV_SECRETS == 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      - name: MÁV GTFS, pfaedle, build and audit
        id: mav
        if: env.MAV_SECRETS == 'true'
        env:
          MAV_GTFS_USER: ${{ secrets.MAV_GTFS_USER }}
          MAV_GTFS_PASSWORD: ${{ secrets.MAV_GTFS_PASSWORD }}
          MAV_GTFS_URL: ${{ vars.MAV_GTFS_URL }}
          OSM_PBF: ${{ github.workspace }}/.osm/hungary-latest.osm.pbf
        run: |
          set -euo pipefail
          rm -f mav-index.json.gz mav-build.json
          rc=0
          bash scripts/release_mav_index.sh "$RUNNER_TEMP/mav" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f mav-index.json.gz
          # 77: MÁV refused the login (release_mav_index.sh); the last step
          # fails the run on it.
          if [ "$rc" -eq 77 ]; then
            echo "failure=auth" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::MÁV refused the login (HTTP 401/403, see this step's log); GitHub Pages keeps the previous index."
          else
            echo "failure=build" >> "$GITHUB_OUTPUT"
            echo "::warning title=Daily MÁV index not built::The MÁV download, pfaedle or the audit failed (see this step's log); GitHub Pages keeps the previous index."
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.MAV_SECRETS == 'true' && steps.mav.outputs.built == 'true' && steps.osm-cache.outputs.cache-hit != 'true'
        with:
          path: .osm
          key: osm-hungary-${{ steps.week.outputs.week }}

      # The manifest, and whether the content differs from what Pages serves
      # (the live manifest's content digest and the MÁV zip's size and
      # sha256; not the overlay's, which pfaedle never writes the same
      # twice), the live manifest is old enough to refresh (REFRESH_AFTER),
      # or its signature (mav-index.json.sig) does not verify: the site job
      # carries no unsigned MÁV manifest, so this build's goes up, signed.
      # The MÁV zip and pfaedle's output are the ones release_mav_index.sh
      # left in its work dir for this build. An index with under half the
      # trains and lines of the published one is refused
      # (mav_shrink_guard.py); when the published manifest does not read,
      # or its signature does not verify (its counts are then anyone's), it
      # is compared with the latest stable release's MÁV index instead
      # (fetched only then). The repository variable MAV_ALLOW_SHRINK=1
      # accepts an intended reduction. A .sig that does not verify, or is
      # not there (HTTP 404), is read again with its manifest 11 minutes
      # later (Pages' cache may pair two deploys' files, or keep the 404 of
      # the .sig from before the first signed deploy) before it counts as
      # untrusted.
      - name: Pages site
        id: site
        if: steps.mav.outputs.built == 'true'
        env:
          MAV_ALLOW_SHRINK: ${{ vars.MAV_ALLOW_SHRINK || '' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          if python3 scripts/mav_pages_site.py --index mav-index.json.gz --stats mav-build.json \
              --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/site" --live-url "$pages_url/mav-index.json" \
              --gtfs-zip "$RUNNER_TEMP/mav/gtfs/mav-gtfs.zip" --pfaedle-dir "$RUNNER_TEMP/mav/gtfs-out" \
              --baseline-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hungarian-transport-frontend.zip" \
              --github-output "$GITHUB_OUTPUT"; then
            ls -l "$RUNNER_TEMP/site"
            exit 0
          fi
          echo "::warning title=Daily MÁV index not published::The built index did not make a Pages site (see this step's log); GitHub Pages keeps the previous index."

      # The site job puts it on Pages. Kept 3 days, as the Pages artifact:
      # "Re-run failed jobs" after a failed site job finds it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.site.outputs.deploy == 'true'
        with:
          name: mav-part
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 3

      # No MÁV part was made (no secrets, a failed build, a refused part):
      # the site job carries the published MÁV files over. Red at once for
      # a refused login, when the published index is 2 days old or older,
      # and when its mav-index.json.sig is not there or does not verify
      # (read again 11 minutes later, past Pages' cache: its built_at is
      # then anyone's), is no signature or is refused (HTTP 4xx); a warning
      # otherwise (a network error, a timeout, HTTP 5xx: its age unknown).
      - name: Published index age
        if: steps.site.outputs.deploy == ''
        env:
          BUILD_FAILURE: ${{ steps.mav.outputs.failure }}
        run: |
          set -euo pipefail
          if [ "$MAV_SECRETS" != true ]; then
            failure=secrets
          elif [ -n "${BUILD_FAILURE:-}" ]; then
            failure="$BUILD_FAILURE"
          else
            failure=site
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 scripts/mav_daily_verdict.py --failure "$failure" --live-url "$pages_url/mav-index.json"

  # The Volán and city indexes, when due, with the latest stable release's
  # code. No MÁV secret; the city feeds' secrets only in the build step.
  timetables:
    name: Build the Volán and city indexes when due
    runs-on: ubuntu-latest
    # Above the sum of its steps' limits (98 minutes): a job that runs out
    # of time ends with nothing for the site job, which carries the
    # published indexes over in their place.
    timeout-minutes: 110
    outputs:
      built: ${{ steps.indexes.outputs.built }}
      schema: ${{ steps.due.outputs.schema }}
      # The published timetables.json's built_at, its signature verified
      # (pages_timetables.py due), "" without one: the site job never
      # carries an older one.
      live_built: ${{ steps.due.outputs.live_built }}
    env:
      # The builders import the integration's package from the checkout.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # As release.yml's latest_stable: the highest vX.Y.Z that is not a
      # prerelease, by version, not by date. A GitHub API failure fails the
      # job (nothing is built; the site job still runs).
      - name: Latest stable release
        id: stable
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name'); then
            echo "::error::Could not list the releases (GitHub API); no Volán or city index is built."
            exit 1
          fi
          tag=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "::warning title=No Volán or city index built::The repository has no stable release (vX.Y.Z); the Volán and city indexes are built with a stable release's code only."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The stable release's builders, guards and index schema at the root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.stable.outputs.tag != ''
        timeout-minutes: 5
        with:
          ref: ${{ steps.stable.outputs.tag }}
          persist-credentials: false

      # pages_timetables.py of the workflow's commit (and what it imports),
      # after the root checkout, which would clean it away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.stable.outputs.tag != ''
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          path: .pages-tools
          sparse-checkout: |
            scripts
            custom_components/hungarian_transport
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.stable.outputs.tag != ''
        timeout-minutes: 5
        with:
          python-version: "3.12"

      # Due, per index: not listed in the published timetables.json, built
      # 6 days 12 hours ago or longer, or built against another index than
      # the stable release's (its release_feed is not the feed in the head
      # of the release zip's index, read by Range requests: only the zip's
      # directory and the heads; or its release_version is not TAG). Both:
      # the manifest is missing or does not read, names another schema than
      # the stable release's, or the dispatch input asks for it. The release's feeds and its tag go to
      # the build step's part (release_feed, release_version) in
      # release-feeds.json.
      - name: Timetables due
        id: due
        if: steps.stable.outputs.tag != ''
        # A few seconds; up to 11 minutes more when the published
        # timetables.json.sig does not verify (read again past Pages' cache).
        timeout-minutes: 15
        env:
          FORCE: ${{ inputs.timetables == true }}
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          set -euo pipefail
          schema=$(sed -n 's/^INDEX_SCHEMA = \([0-9][0-9]*\)$/\1/p' scripts/gtfs_compact.py)
          if [[ ! "$schema" =~ ^[0-9]+$ ]]; then
            echo "::error::The stable release's scripts/gtfs_compact.py names no INDEX_SCHEMA."
            exit 1
          fi
          echo "schema=${schema}" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 .pages-tools/scripts/pages_timetables.py due --schema "$schema" --live-url "$pages_url" \
            --force "$FORCE" --github-output "$GITHUB_OUTPUT" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hungarian-transport-frontend.zip" \
            --release-out "$RUNNER_TEMP/release-feeds.json" --release-tag "$TAG"

      # The builders compare against the index already in place: a city feed
      # that vanished, most of a feed's trips gone or a near-empty Volán index
      # refuses that index, as in the release. The published indexes are the
      # baseline (checked against timetables.json), else the stable
      # release's; kept with their shapes in .baseline, which the builders
      # do not touch.
      - name: Baseline indexes
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 10
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 .pages-tools/scripts/pages_timetables.py baseline --live-url "$pages_url" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hungarian-transport-frontend.zip" \
            --out .baseline
          for f in volan-index.json.gz city-index.json.gz; do
            if [ -f ".baseline/$f" ]; then cp ".baseline/$f" .; fi
          done
          ls -l .baseline

      # Only the due indexes. Volán and city are independent: a builder that
      # fails (its guard included) or runs out of its time (exit 124) leaves
      # its index out of this run's part with a warning, and the site job
      # carries the published one over. A city feed whose download fails
      # keeps the baseline's part (build_city_index.py, CARRY_ENV; its shapes
      # are next to it in .baseline). Plain http only for a feed whose entry
      # says "insecure" (Miskolc, whose https certificate names another
      # host), with a warning, as in a release: HUNGARIAN_TRANSPORT_HTTPS_ONLY
      # (gtfs_compact.py) is left unset here, since Miskolc would never
      # update and, once its calendar ran out, the city guard would refuse
      # the whole city index. The manifest's signature covers what is built.
      # Each part records the release's feed of its index (release_feed) and
      # the release's tag (release_version).
      - name: Build the Volán and city indexes
        id: indexes
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 45
        env:
          BAHART_GTFS_URL: ${{ secrets.BAHART_GTFS_URL }}
          MOBILITY_DATABASE_REFRESH_TOKEN: ${{ secrets.MOBILITY_DATABASE_REFRESH_TOKEN }}
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
          ALLOW_MISSING_VAR: ${{ vars.HUNGARIAN_TRANSPORT_ALLOW_MISSING || '' }}
          VOLAN_GTFS_URL: ${{ vars.VOLAN_GTFS_URL || '' }}
          DUE_INDEXES: ${{ steps.due.outputs.indexes }}
          SCHEMA: ${{ steps.due.outputs.schema }}
        run: |
          set -euo pipefail
          # The value ends up in workflow commands below (::warning::). A
          # newline in it would start a command of its own, so only feed
          # ids, "all", commas and spaces get through; anything else stops
          # the run without echoing the value.
          if [[ ! "$ALLOW_MISSING_VAR" =~ ^[A-Za-z0-9_.,\ -]*$ ]]; then
            echo "::error title=Bad allow_missing::ALLOW_MISSING_VAR may only hold feed ids, all, commas and spaces."
            exit 1
          fi
          # The variable relaxes the city guard for every run, so say so on
          # every run until it is unset again.
          if [ -n "$ALLOW_MISSING_VAR" ]; then
            echo "::warning title=City index guard relaxed::Repository variable HUNGARIAN_TRANSPORT_ALLOW_MISSING='${ALLOW_MISSING_VAR}' lets every run drop these city feeds. Unset it once the feed is back."
          fi
          export HUNGARIAN_TRANSPORT_ALLOW_MISSING="$ALLOW_MISSING_VAR"
          if [ -f .baseline/city-index.json.gz ]; then
            export HUNGARIAN_TRANSPORT_CARRY_INDEX=.baseline/city-index.json.gz
          fi
          part="$RUNNER_TEMP/timetables-part"
          built=""
          IFS=, read -r -a names <<< "$DUE_INDEXES"
          for name in "${names[@]}"; do
            case "$name" in volan|city) ;; *) echo "::error::unexpected index name"; exit 1 ;; esac
            rc=0
            timeout --kill-after=1m 20m python3 "scripts/build_${name}_index.py" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning title=${name} index not built::build_${name}_index.py failed (exit ${rc}, see this step's log); GitHub Pages keeps the published ${name} index."
              continue
            fi
            if python3 .pages-tools/scripts/pages_timetables.py part --schema "$SCHEMA" \
                --index "${name}-index.json.gz" --out "$part" --baseline ".baseline/${name}-index.json.gz" \
                --release-feeds "$RUNNER_TEMP/release-feeds.json"; then
              built="${built:+$built,}${name}"
            fi
          done
          echo "built=${built}" >> "$GITHUB_OUTPUT"
          if [ -d "$part" ]; then ls -l "$part"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.indexes.outputs.built != ''
        timeout-minutes: 10
        with:
          name: timetables-part
          path: ${{ runner.temp }}/timetables-part
          if-no-files-found: error
          retention-days: 3

  # The whole site: this run's parts, and everything else carried over from
  # the live site (checked file by file against its published manifests).
  # Whatever the build and timetables jobs did (failed, timed out), unless
  # the run itself is cancelled: a job without its part output gives none,
  # and the published files are carried over in its place. The build job
  # fails on a stale MÁV index, and the timetables one may run out of time,
  # while the other part is new.
  site:
    name: Assemble the GitHub Pages site
    needs: [build, timetables]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A few minutes; up to 11 more when a published manifest's .sig does not
    # verify (read again past Pages' cache, once per run).
    timeout-minutes: 35
    outputs:
      deploy: ${{ steps.assemble.outputs.deploy }}
      untrusted: ${{ steps.assemble.outputs.untrusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.deploy == 'true'
        with:
          name: mav-part
          path: ${{ runner.temp }}/mav-part

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.timetables.outputs.built != ''
        with:
          name: timetables-part
          path: ${{ runner.temp }}/timetables-part

      # deploy=true when the MÁV part or a Volán or city index is new. A
      # published Volán or city index that cannot be carried is left out with
      # a warning; a MÁV file that cannot be, or a published manifest that
      # does not read, fails the job (::error::) and nothing is deployed, as
      # does a published mav-index.json whose .sig does not verify when this
      # run has no MÁV part (with no .sig at all: a warning, nothing
      # deployed). untrusted: the published manifests whose .sig is there
      # but does not verify (the signatures job).
      # SCHEMA (the stable release's) names timetables.json's schema only
      # for a site without any index. MAV_BUILT and TIMETABLES_BUILT: the
      # built_at the build and timetables jobs read for the published
      # manifests (signatures verified). A published manifest older than
      # that is a cache's copy of an older deploy (Pages caches each file
      # for 10 minutes; a run queued right behind a deploy may meet one,
      # consistent with its own .sig): read again once past the cache, it
      # stops the deploy when still older, never carried over the newer one.
      - name: Assemble the site
        id: assemble
        env:
          MAV_NEW: ${{ needs.build.outputs.deploy == 'true' }}
          TIMETABLES_NEW: ${{ needs.timetables.outputs.built != '' }}
          SCHEMA: ${{ needs.timetables.outputs.schema }}
          MAV_BUILT: ${{ needs.build.outputs.live_built }}
          TIMETABLES_BUILT: ${{ needs.timetables.outputs.live_built }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          parts=()
          if [ "$MAV_NEW" = true ]; then parts+=(--mav-part "$RUNNER_TEMP/mav-part"); fi
          if [ "$TIMETABLES_NEW" = true ]; then parts+=(--timetables-part "$RUNNER_TEMP/timetables-part"); fi
          if [[ "$SCHEMA" =~ ^[0-9]+$ ]]; then parts+=(--schema "$SCHEMA"); fi
          if [ -n "${MAV_BUILT:-}" ]; then parts+=(--mav-built-at "$MAV_BUILT"); fi
          if [ -n "${TIMETABLES_BUILT:-}" ]; then parts+=(--timetables-built-at "$TIMETABLES_BUILT"); fi
          python3 scripts/pages_timetables.py assemble --out "$RUNNER_TEMP/site" --commit "$GITHUB_SHA" \
            --live-url "$pages_url" --github-output "$GITHUB_OUTPUT" "${parts[@]}"
          if [ -d "$RUNNER_TEMP/site" ]; then ls -l "$RUNNER_TEMP/site"; fi

      # The sign job signs it and makes the Pages artifact. Kept 3 days, as
      # the Pages artifact. "Re-run failed jobs" after a failed sign job
      # (no key, openssl) signs and deploys this artifact as it was made,
      # however old: worth it only while no later run has deployed (the
      # sign job refuses it once GitHub Pages serves a newer site), and
      # only when no run of this workflow is queued (see the top).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.assemble.outputs.deploy == 'true'
        with:
          name: pages-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 3

  # timetables.json.sig: one line, base64 of the ed25519 signature over
  # timetables.json's bytes as deployed (every deploy writes a new
  # timetables.json, so every deploy signs it here), and mav-index.json.sig
  # the same way over mav-index.json when the site has it (a carried one
  # verified first, so the same bytes and signature again). The integration
  # checks them against the public key it pins before it reads a manifest,
  # and the next run's site job before it carries anything over from one. The
  # private key (PAGES_SIGNING_KEY, base64 of the 32-byte seed) is a secret
  # of the github-pages environment, whose deployment branch policy admits
  # only main, and this job runs only on main as well: a dispatch from
  # another branch, or a workflow changed on one, never reaches it. In the
  # job, only the signing step's env has it; the script hands it to openssl
  # on stdin and checks the signature against the pinned public key. No
  # secret, another key, or a signature that does not verify fails the job:
  # no Pages artifact, nothing deployed, never an unsigned manifest. A fork
  # without the secret deploys nothing. The token reads contents only, for
  # the one script it checks out. Before the key is read, a site older than
  # the one GitHub Pages serves is refused (sign_manifest.py live-check: the
  # published timetables.json, its signature verifying, names a later
  # built_at): a re-run of this job after a later run deployed would put
  # this run's older indexes back on Pages.
  sign:
    name: Sign the manifest
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' && needs.site.outputs.deploy == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign_manifest.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-site
          path: ${{ runner.temp }}/site

      # A published timetables.json that cannot be read or is not trusted
      # holds nothing back (its built_at is then anyone's).
      - name: No newer site on GitHub Pages
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 scripts/sign_manifest.py live-check --site "$RUNNER_TEMP/site" --live-url "$pages_url"

      - name: Sign the manifest
        env:
          PAGES_SIGNING_KEY: ${{ secrets.PAGES_SIGNING_KEY }}
        run: python3 scripts/sign_manifest.py sign --site "$RUNNER_TEMP/site"

      # Kept 3 days, not the action's 1: the attest job reads this artifact,
      # and "Re-run failed jobs" after a Sigstore outage finds it over a
      # weekend (after 1 day the re-run failed with "artifact not found").
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          retention-days: 3

  deploy:
    name: Publish on GitHub Pages
    needs: sign
    # success() would also ask for the build and timetables jobs (it looks
    # at every job before this one), and the build job fails on a stale
    # MÁV index while the site may still have a new Volán or city index.
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    # deploy-pages waits up to 10 minutes for the deployment itself; the
    # job's limit leaves it that and the Pages check.
    timeout-minutes: 20
    # Only this job may deploy; it runs no code from the checkout.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages fails on a repository without Pages with an error that
      # does not say what to do; this one does. Only a 404 means "not
      # enabled": any other answer leaves the decision to deploy-pages.
      - name: GitHub Pages enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          err="$RUNNER_TEMP/pages-check.err"
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$err"); then
            if [ "$build_type" != "workflow" ]; then
              echo "::error title=GitHub Pages source is not GitHub Actions::Settings, Pages, Build and deployment: set Source to GitHub Actions (now: ${build_type}). Nothing was published."
              exit 1
            fi
            echo "GitHub Pages: source GitHub Actions"
          elif grep -q "HTTP 404" "$err"; then
            echo "::error title=GitHub Pages is not enabled::Settings, Pages, Build and deployment: set Source to GitHub Actions, then run this workflow again. Nothing was published."
            exit 1
          else
            echo "::warning::Could not read the Pages settings ($(head -c 200 "$err" | tr -d '\r\n')); deploying anyway."
          fi

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  # Red when the site job found a published manifest whose .sig is there but
  # does not verify against the pinned key, also read again 11 minutes
  # after the first read (past Pages' 10-minute cache: not a manifest and a
  # .sig of two deploys, but edited after signing, another key, or a site
  # that is not this
  # workflow's). Nothing of it was carried, and the deploy, when there was
  # one, replaced it with a signed one; the run still fails, so that someone
  # looks. Not the site or sign job: failing there would hold back the
  # deploy that replaces it (with a new key pair, every deploy after it). A
  # .sig that is not there (HTTP 404, the first run after signing came in)
  # is a warning only.
  signatures:
    name: Published manifest signatures
    needs: [site, deploy]
    if: ${{ !cancelled() && needs.site.outputs.untrusted != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: A published signature does not verify
        env:
          UNTRUSTED: ${{ needs.site.outputs.untrusted }}
        run: |
          set -euo pipefail
          # Names from pages_timetables.py; nothing else gets into the annotation.
          if [[ ! "$UNTRUSTED" =~ ^[a-z.,-]+$ ]]; then UNTRUSTED="(unexpected names)"; fi
          echo "::error title=Published manifest signature does not verify::${UNTRUSTED}: its .sig on GitHub Pages does not verify against the pinned public key. Nothing was carried over from it; see the site job's log."
          exit 1

  # A build provenance attestation (Sigstore, signed with this job's OIDC
  # token) of the files just deployed, taken from the artifact Pages
  # deployed, not rebuilt: the MÁV files when the site has them (a fork
  # without the MÁV secrets has none), timetables.json, the Volán and city
  # indexes and their shapes shards. Check a download with
  #   gh attestation verify mav-index.json.gz --repo bator/hungarian-transport \
  #     --signer-workflow bator/hungarian-transport/.github/workflows/mav-index-daily.yml \
  #     --source-ref refs/heads/main
  # (any other file of the site the same way; --source-ref: a run dispatched
  # from another branch signs with the same workflow file, and its files do
  # not pass). A carried file is attested again by the run that deploys it
  # again. After the deploy, in a job of its own: a Sigstore outage turns
  # the run red but never holds back the day's index, and "Re-run failed
  # jobs" runs only this job, never the deploy, which would put this run's
  # artifact back on Pages over a newer run's index. That re-run works while
  # the artifact is kept (3 days, see the upload) and
  # joins the concurrency group (see the top: re-run when no run is queued).
  # A file without an attestation fails that check, it never passes it. The
  # integration does not verify it (it would need a Sigstore client in Home
  # Assistant); it checks each file against its manifest's sha256
  # (mav_daily.py, weekly_timetables.py).
  attest:
    name: Attest the published files
    needs: [build, timetables, deploy]
    # As the deploy job's: success() would also ask for the build job.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The artifact of this run needs no token; the attestation needs these
    # two. No Pages, no contents, no checkout.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # The attested files, one per line: only what this run built (the MÁV
      # part when the build job made one, each Volán or city index the
      # timetables job built with its shapes folder) and the timetables.json
      # it wrote. A file carried over from the live site keeps the
      # attestation of the run that built it: attesting it again here would
      # vouch for bytes this run took from Pages, not from its own build.
      # The four MÁV files come together (mav_pages_site.py writes them all).
      - name: Unpack the deployed site
        id: files
        env:
          MAV_NEW: ${{ needs.build.outputs.deploy == 'true' }}
          BUILT: ${{ needs.timetables.outputs.built }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$site"
          test -f "$site/timetables.json" || { echo "::error::timetables.json is not in the deployed site"; exit 1; }
          subjects=("$site/timetables.json")
          if [ "$MAV_NEW" = true ]; then
            for f in mav-index.json.gz mav-index.json mav-gtfs.zip mav-pfaedle-overlay.zip; do
              test -f "$site/$f" || { echo "::error::$f is not in the deployed site"; exit 1; }
              subjects+=("$site/$f")
            done
          fi
          IFS=, read -r -a built <<< "$BUILT"
          for name in "${built[@]}"; do
            case "$name" in volan|city) ;; *) echo "::error::unexpected index name"; exit 1 ;; esac
            test -f "$site/${name}-index.json.gz" || { echo "::error::${name}-index.json.gz is not in the deployed site"; exit 1; }
            subjects+=("$site/${name}-index.json.gz")
            dir=$(python3 -c 'import json,sys; e=json.load(open(sys.argv[1]))["indexes"][sys.argv[2]]; print((e.get("shapes") or {}).get("dir") or "")' \
              "$site/timetables.json" "$name")
            if [ -n "$dir" ]; then
              [[ "$dir" =~ ^${name}-shapes-[0-9a-f]+$ ]] || { echo "::error::bad shapes folder name"; exit 1; }
              shopt -s nullglob
              for f in "$site/$dir"/*.json.gz; do subjects+=("$f"); done
              shopt -u nullglob
            fi
          done
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${subjects[@]}"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${#subjects[@]} files to attest"
          ls -l "$site"

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.files.outputs.subjects }}
