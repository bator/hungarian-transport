name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: HACS validation
        # main as of 2026-06-08; bump deliberately.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest validation
        # master as of 2026-09-27; bump deliberately.
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  tests:
    name: Card and GTFS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Python lint
        run: |
          pip install ruff==0.16.10
          ruff check --target-version py312 --select E,F,W,B --ignore E501,B905 custom_components scripts

      # dist/leaflet is Leaflet 1.9.4 as published on npm (leaflet-1.9.4.tgz,
      # integrity sha512-nxS1ynzJ...FA74PA==; package/dist/leaflet.js,
      # leaflet.css and package/LICENSE, byte for byte, checked 2026-10-19).
      # A change to these files has to update .github/vendored.sha256 on purpose.
      - name: Vendored Leaflet matches its recorded hashes
        run: sha256sum --check --strict .github/vendored.sha256

      - name: Bundle is up to date with src/
        run: |
          npm run build
          git diff --exit-code -- dist/hungarian-transport.js dist/hungarian-transport-loader.js

      - name: Card tests
        run: npm test

      - name: Compact GTFS tests
        run: python3 scripts/test_gtfs_compact.py

      - name: Index updater tests
        run: python3 scripts/test_update_volan_index.py

      - name: Index guard tests
        run: python3 scripts/test_build_guards.py

      # The release workflow's "Resolve tag" step, against a stub gh and git;
      # release.yml runs it too, but only after a change reached main.
      - name: Release tag resolve tests
        run: python3 scripts/test_release_resolve.py

      - name: FUTÁR proxy limit tests
        run: python3 ha/test_futar_limits.py

      - name: Manual server tests
        run: python3 docs/manual/tools/test_server.py

      - name: Card URL tag tests
        run: python3 ha/test_assets.py

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test harness
        run: pip install -r requirements_test.txt

      - name: pytest
        run: python -m pytest -q

  integration-oldest:
    # hacs.json lets HACS install on Home Assistant 2024.10.0; the job above
    # runs the current release only.
    name: Integration tests (oldest HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The Python Home Assistant 2024.10 was released for.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test_oldest.txt

      - name: Install Home Assistant 2024.10 test harness
        run: pip install -r requirements_test_oldest.txt

      - name: Home Assistant version
        run: python -c "from homeassistant.const import __version__; assert __version__ == '2024.10.0', __version__"

      - name: pytest
        run: python -m pytest -q
