name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Card and GTFS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Bundle is up to date with src/
        run: |
          npm run build
          git diff --exit-code -- dist/hungarian-transport.js

      - name: Card tests
        run: npm test

      - name: Compact GTFS tests
        run: python3 scripts/test_gtfs_compact.py

      - name: Index updater tests
        run: python3 scripts/test_update_volan_index.py

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test harness
        run: pip install -r requirements_test.txt

      - name: pytest
        run: python -m pytest -q
