name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        # main as of 2026-06-08; bump deliberately.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest validation
        # master as of 2026-09-27; bump deliberately.
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  tests:
    name: Card and GTFS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Python lint
        run: |
          pip install ruff==0.16.10
          ruff check --target-version py312 --select E,F,W,B --ignore E501,B905 custom_components scripts

      - name: Bundle is up to date with src/
        run: |
          npm run build
          git diff --exit-code -- dist/hungarian-transport.js dist/hungarian-transport-loader.js

      - name: Card tests
        run: npm test

      - name: Compact GTFS tests
        run: python3 scripts/test_gtfs_compact.py

      - name: Index updater tests
        run: python3 scripts/test_update_volan_index.py

      - name: Index guard tests
        run: python3 scripts/test_build_guards.py

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test harness
        run: pip install -r requirements_test.txt

      - name: pytest
        run: python -m pytest -q
