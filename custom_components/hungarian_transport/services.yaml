elvira_between:
  fields:
    origin_code:
      required: true
      selector:
        text:
    dest_code:
      required: true
      selector:
        text:
    minutes_after:
      default: 180
      selector:
        number:
          min: 15
          max: 480
          mode: box
    dest_name:
      selector:
        text:
futar:
  fields:
    path:
      required: true
      selector:
        select:
          options:
            - arrivals-and-departures-for-stop.json
            - plan-trip.json
            - route-details.json
            - schedule-for-stop.json
            - search.json
            - trip-details.json
    params:
      selector:
        object:
rebuild_mav_index:
realtime:
  fields:
    feed:
      required: true
      example: volan
      selector:
        text:
    trips:
      required: true
      example: '[{"key": "1", "trip_id": "hkir_1010_10-5", "stops": ["hkir_109755"], "from": 0}]'
      selector:
        object:
